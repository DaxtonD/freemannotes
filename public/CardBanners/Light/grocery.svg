      <line x1="282" y1="0" x2="522" y2="240" stroke="#CBAB7A" stroke-width="2.2" opacity="0.3"/>
      <line x1="300" y1="0" x2="540" y2="240" stroke="#CBAB7A" stroke-width="2.2" opacity="0.3"/>
      <line x1="318" y1="0" x2="558" y2="240" stroke="#CBAB7A" stroke-width="2.2" opacity="0.3"/>
