  <!-- paper texture -->
  <rect width="520" height="240" fill="#F6EFE0" filter="url(#tex_grocery_light)" opacity="0.06"/>

  <!-- icon -->
  <g transform="translate(420,120)">
  <!-- celery stalks -->
  <g transform="rotate(-10,-16,-30)">
    <rect x="-19" y="-42" width="6" height="22" rx="3" fill="#B07A40" opacity="0.5"/>
  </g>
  <g transform="rotate(6,-8,-32)">
    <rect x="-11" y="-46" width="6" height="26" rx="3" fill="#B07A40" opacity="0.6"/>
  </g>
  <!-- baguette -->
  <g transform="rotate(18,14,-32)">
    <rect x="9" y="-44" width="11" height="26" rx="5.5" fill="#B07A40" opacity="0.75"/>
    <line x1="11" y1="-38" x2="17" y2="-40" stroke="#CBAB7A" stroke-width="2" stroke-linecap="round"/>
    <line x1="12" y1="-31" x2="18" y2="-33" stroke="#CBAB7A" stroke-width="2" stroke-linecap="round"/>
  </g>
  <!-- bag body -->
  <path d="M-30,-22 L-37,39 Q-37.6,44 -32.6,44 L32.6,44 Q37.6,44 37,39 L30,-22 Z" fill="#CBAB7A" opacity="0.28"/>
  <path d="M-30,-22 L-37,39 Q-37.6,44 -32.6,44 L32.6,44 Q37.6,44 37,39 L30,-22 Z" fill="none" stroke="#B07A40" stroke-width="3.5" stroke-linejoin="round"/>
  <!-- handle -->
  <path d="M-13,-22 v-5 a13,13 0 0 1 26,0 v5" fill="none" stroke="#B07A40" stroke-width="3.5" stroke-linecap="round"/>
  <!-- bag crease -->
  <line x1="-24" y1="-12" x2="-28.5" y2="34" stroke="#B07A40" stroke-width="2.5" stroke-linecap="round" opacity="0.35"/>
  </g>

  <!-- border -->
  <rect width="520" height="240" fill="none" stroke="#CBAB7A" stroke-width="1" opacity="0.3"/>
</svg>
