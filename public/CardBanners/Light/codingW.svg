<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="240" viewBox="0 0 1000 240">
  <defs>
    <filter id="tex_coding_light_w" x="0%" y="0%" width="100%" height="100%" color-interpolation-filters="linearRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="4" seed="12" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0" result="gn"/>
      <feBlend in="SourceGraphic" in2="gn" mode="overlay"/>
    </filter>
    <linearGradient id="hfade_coding_light_w" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"  stop-color="#E5EAF0" stop-opacity="0"/>
      <stop offset="50%" stop-color="#E5EAF0" stop-opacity="0"/>
      <stop offset="82%" stop-color="#E5EAF0" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#E5EAF0" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="vign_coding_light_w" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#385880" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#385880" stop-opacity="0.09"/>
    </linearGradient>
    <linearGradient id="diag_coding_light_w" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6088A8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#6088A8" stop-opacity="0"/>
      <stop offset="100%" stop-color="#6088A8" stop-opacity="0.12"/>
    </linearGradient>
  </defs>

  <!-- base -->
  <rect width="1000" height="240" fill="#E5EAF0"/>
  <rect width="1000" height="240" fill="url(#vign_coding_light_w)"/>

  <!-- diagonal sheen -->
  <rect width="1000" height="240" fill="url(#diag_coding_light_w)"/>
  <rect width="1000" height="240" fill="url(#hfade_coding_light_w)"/>

  <!-- paper texture -->
  <rect width="1000" height="240" fill="#E5EAF0" filter="url(#tex_coding_light_w)" opacity="0.06"/>

  <!-- icon -->
  <g transform="translate(880,120) scale(0.6)">
  <!-- editor window -->
  <rect x="-46" y="-34" width="92" height="68" rx="8" fill="#6088A8" opacity="0.28"/>
  <rect x="-46" y="-34" width="92" height="68" rx="8" fill="none" stroke="#385880" stroke-width="3.5"/>
  <!-- title bar -->
  <line x1="-46" y1="-18" x2="46" y2="-18" stroke="#385880" stroke-width="2.5" opacity="0.6"/>
  <circle cx="-36" cy="-26" r="3" fill="#385880" opacity="0.7"/>
  <circle cx="-26" cy="-26" r="3" fill="#385880" opacity="0.55"/>
  <circle cx="-16" cy="-26" r="3" fill="#385880" opacity="0.4"/>
  <!-- code glyphs -->
  <path d="M-14,-4 L-27,8 L-14,20" fill="none" stroke="#385880" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M14,-4 L27,8 L14,20" fill="none" stroke="#385880" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="5" y1="-6" x2="-5" y2="22" stroke="#385880" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
  </g>

  <!-- border -->
  <rect width="1000" height="240" fill="none" stroke="#6088A8" stroke-width="1" opacity="0.3"/>
</svg>
