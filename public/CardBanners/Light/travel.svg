<svg xmlns="http://www.w3.org/2000/svg" width="520" height="240" viewBox="0 0 520 240">
  <defs>
    <filter id="tex_travel_light" x="0%" y="0%" width="100%" height="100%" color-interpolation-filters="linearRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="4" seed="12" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0" result="gn"/>
      <feBlend in="SourceGraphic" in2="gn" mode="overlay"/>
    </filter>
    <linearGradient id="hfade_travel_light" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"  stop-color="#E5EAF5" stop-opacity="0"/>
      <stop offset="50%" stop-color="#E5EAF5" stop-opacity="0"/>
      <stop offset="82%" stop-color="#E5EAF5" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#E5EAF5" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="vign_travel_light" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#486898" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#486898" stop-opacity="0.09"/>
    </linearGradient>
    <linearGradient id="diag_travel_light" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#789CC8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#789CC8" stop-opacity="0"/>
      <stop offset="100%" stop-color="#789CC8" stop-opacity="0.12"/>
    </linearGradient>
  </defs>

  <!-- base -->
  <rect width="520" height="240" fill="#E5EAF5"/>
  <rect width="520" height="240" fill="url(#vign_travel_light)"/>

  <!-- diagonal sheen -->
  <rect width="520" height="240" fill="url(#diag_travel_light)"/>
  <rect width="520" height="240" fill="url(#hfade_travel_light)"/>

  <!-- paper texture -->
  <rect width="520" height="240" fill="#E5EAF5" filter="url(#tex_travel_light)" opacity="0.06"/>

  <!-- icon -->
  <g transform="translate(420,120)">
  <!-- flight path -->
  <path d="M-44,40 Q-16,44 8,28" fill="none" stroke="#486898" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="1,9" opacity="0.8"/>
  <!-- airplane -->
  <g transform="rotate(45) scale(3.4) translate(-11.5,-12)">
    <path d="M21,16v-2l-8-5V3.5C13,2.67,12.33,2,11.5,2S10,2.67,10,3.5V9l-8,5v2l8-2.5V19l-2,1.5V22l3.5-1l3.5,1v-1.5L13,19v-5.5L21,16z" fill="#486898" opacity="0.9"/>
  </g>
  </g>

  <!-- border -->
  <rect width="520" height="240" fill="none" stroke="#789CC8" stroke-width="1" opacity="0.3"/>
</svg>
