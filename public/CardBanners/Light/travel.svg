      <line x1="504" y1="0" x2="744" y2="240" stroke="#789CC8" stroke-width="2.2" opacity="0.3"/>
      <line x1="522" y1="0" x2="762" y2="240" stroke="#789CC8" stroke-width="2.2" opacity="0.3"/>
      <line x1="540" y1="0" x2="780" y2="240" stroke="#789CC8" stroke-width="2.2" opacity="0.3"/>
    <rect width="520" height="240" fill="url(#hfade_travel)"/>
  </g>

  <!-- paper texture -->
  <rect width="520" height="240" fill="#E5EAF5" filter="url(#tex)" opacity="0.04"/>

  <!-- icon -->
  <g transform="translate(420,120)">
  <!-- suitcase body -->
  <rect x="-32" y="-18" width="64" height="52" rx="6" fill="#789CC8" opacity="0.28"/>
  <rect x="-32" y="-18" width="64" height="52" rx="6" fill="none" stroke="#486898" stroke-width="3.5"/>
  <!-- handle -->
  <path d="M-14,-18 L-14,-30 Q-14,-36 0,-36 Q14,-36 14,-30 L14,-18" fill="none" stroke="#486898" stroke-width="3.5" stroke-linecap="round"/>
  <!-- center divider -->
  <line x1="-32" y1="8" x2="32" y2="8" stroke="#486898" stroke-width="2.2" opacity="0.45"/>
  <!-- wheels -->
  <circle cx="-20" cy="34" r="5" fill="#486898" opacity="0.55"/>
  <circle cx="20" cy="34" r="5" fill="#486898" opacity="0.55"/>
  <!-- straps -->
  <line x1="-18" y1="-18" x2="-18" y2="34" stroke="#486898" stroke-width="2" opacity="0.4"/>
  <line x1="18" y1="-18" x2="18" y2="34" stroke="#486898" stroke-width="2" opacity="0.4"/>
  <!-- airplane -->
  <g transform="translate(36,-38) rotate(-30)">
    <path d="M0,-10 L3,6 L0,4 L-3,6 Z" fill="#486898" opacity="0.75"/>
    <path d="M-10,2 L10,2 L8,5 L-8,5 Z" fill="#486898" opacity="0.65"/>
    <path d="M-5,4 L5,4 L4,7 L-4,7 Z" fill="#486898" opacity="0.55"/>
  </g>
</g>

  <!-- border -->
  <rect width="520" height="240" fill="none" stroke="#789CC8" stroke-width="1" opacity="0.3"/>
</svg>