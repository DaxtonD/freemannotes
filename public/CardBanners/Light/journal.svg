      <line x1="300" y1="0" x2="540" y2="240" stroke="#88A870" stroke-width="2.2" opacity="0.3"/>
      <line x1="318" y1="0" x2="558" y2="240" stroke="#88A870" stroke-width="2.2" opacity="0.3"/>
