  <!-- paper texture -->
  <rect width="520" height="240" fill="#EBF0E8" filter="url(#tex_journal_light)" opacity="0.06"/>

  <!-- icon -->
  <g transform="translate(420,120)">
  <!-- notebook body -->
  <rect x="-36" y="-42" width="62" height="86" rx="6" fill="#88A870" opacity="0.28"/>
  <rect x="-36" y="-42" width="62" height="86" rx="6" fill="none" stroke="#5A7848" stroke-width="3.5"/>
  <!-- spiral rings -->
  <circle cx="-36" cy="-30" r="4" fill="none" stroke="#5A7848" stroke-width="2.5"/>
  <circle cx="-36" cy="-14" r="4" fill="none" stroke="#5A7848" stroke-width="2.5"/>
  <circle cx="-36" cy="2" r="4" fill="none" stroke="#5A7848" stroke-width="2.5"/>
  <circle cx="-36" cy="18" r="4" fill="none" stroke="#5A7848" stroke-width="2.5"/>
  <circle cx="-36" cy="34" r="4" fill="none" stroke="#5A7848" stroke-width="2.5"/>
  <!-- text lines -->
  <line x1="-24" y1="-26" x2="14" y2="-26" stroke="#5A7848" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
  <line x1="-24" y1="-13" x2="14" y2="-13" stroke="#5A7848" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
  <line x1="-24" y1="0" x2="8" y2="0" stroke="#5A7848" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
  <line x1="-24" y1="13" x2="2" y2="13" stroke="#5A7848" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
  <!-- pen -->
  <g transform="translate(34,2) rotate(20)">
    <rect x="-4.5" y="-30" width="9" height="48" rx="4" fill="#5A7848" opacity="0.9"/>
    <path d="M-4.5,18 L0,30 L4.5,18 Z" fill="#5A7848" opacity="0.9"/>
    <line x1="-4.5" y1="10" x2="4.5" y2="10" stroke="#88A870" stroke-width="2"/>
  </g>
  </g>

  <!-- border -->
  <rect width="520" height="240" fill="none" stroke="#88A870" stroke-width="1" opacity="0.3"/>
</svg>
