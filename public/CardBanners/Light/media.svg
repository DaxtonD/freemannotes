      <line x1="486" y1="0" x2="726" y2="240" stroke="#8880B0" stroke-width="2.2" opacity="0.3"/>
      <line x1="504" y1="0" x2="744" y2="240" stroke="#8880B0" stroke-width="2.2" opacity="0.3"/>
      <line x1="522" y1="0" x2="762" y2="240" stroke="#8880B0" stroke-width="2.2" opacity="0.3"/>
      <line x1="540" y1="0" x2="780" y2="240" stroke="#8880B0" stroke-width="2.2" opacity="0.3"/>
    <rect width="520" height="240" fill="url(#hfade_media)"/>
  </g>

  <!-- paper texture -->
  <rect width="520" height="240" fill="#E8E8F2" filter="url(#tex)" opacity="0.04"/>

  <!-- icon -->
  <g transform="translate(420,120)">
  <!-- film strip left -->
  <rect x="-48" y="-20" width="10" height="52" rx="2" fill="#8880B0" opacity="0.35"/>
  <rect x="-48" y="-20" width="10" height="52" rx="2" fill="none" stroke="#585088" stroke-width="2"/>
  <rect x="-46" y="-14" width="6" height="8" rx="1" fill="#585088" opacity="0.45"/>
  <rect x="-46" y="0" width="6" height="8" rx="1" fill="#585088" opacity="0.45"/>
  <rect x="-46" y="14" width="6" height="8" rx="1" fill="#585088" opacity="0.45"/>
  <!-- clapperboard body -->
  <rect x="-36" y="-12" width="76" height="56" rx="4" fill="#8880B0" opacity="0.28"/>
  <rect x="-36" y="-12" width="76" height="56" rx="4" fill="none" stroke="#585088" stroke-width="3.5"/>
  <!-- clapper top -->
  <rect x="-36" y="-30" width="76" height="22" rx="4" fill="#585088" opacity="0.3"/>
  <rect x="-36" y="-30" width="76" height="22" rx="4" fill="none" stroke="#585088" stroke-width="3"/>
  <!-- clapper stripes -->
  <polygon points="-28,-30 -14,-30 -22,-8 -36,-8" fill="#585088" opacity="0.5"/>
  <polygon points="-6,-30 8,-30 0,-8 -14,-8" fill="#585088" opacity="0.5"/>
  <polygon points="16,-30 30,-30 22,-8 8,-8" fill="#585088" opacity="0.5"/>
  <!-- play button -->
  <polygon points="-8,6 -8,34 28,20" fill="#585088" opacity="0.7"/>
</g>

  <!-- border -->
  <rect width="520" height="240" fill="none" stroke="#8880B0" stroke-width="1" opacity="0.3"/>
</svg>