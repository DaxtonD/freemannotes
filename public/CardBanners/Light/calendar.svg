<svg xmlns="http://www.w3.org/2000/svg" width="520" height="240" viewBox="0 0 520 240">
  <defs>
    <filter id="tex" x="0%" y="0%" width="100%" height="100%" color-interpolation-filters="linearRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="4" seed="12" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0" result="gn"/>
      <feBlend in="SourceGraphic" in2="gn" mode="overlay"/>
    </filter>
    <linearGradient id="hfade_calendar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"  stop-color="#F0EBE0" stop-opacity="0"/>
      <stop offset="50%" stop-color="#F0EBE0" stop-opacity="0"/>
      <stop offset="82%" stop-color="#F0EBE0" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#F0EBE0" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="vign_calendar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#985A28" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#985A28" stop-opacity="0.09"/>
    </linearGradient>
  </defs>

  <!-- base -->
  <rect width="520" height="240" fill="#F0EBE0"/>
  <rect width="520" height="240" fill="url(#vign_calendar)"/>

  <!-- diagonal hatch -->
  <g>
    <line x1="-144" y1="0" x2="96" y2="240" stroke="#BF8A50" stroke-width="2.2" opacity="0.3"/>
      <line x1="-126" y1="0" x2="114" y2="240" stroke="#BF8A50" stroke-width="2.2" opacity="0.3"/>
      <line x1="-108" y1="0" x2="132" y2="240" stroke="#BF8A50" stroke-width="2.2" opacity="0.3"/>
      <line x1="-90" y1="0" x2="150" y2="240" stroke="#BF8A50" stroke-width="2.2" opacity="0.3"/>
      <line x1="-72" y1="0" x2="168" y2="240" stroke="#BF8A50" stroke-width="2.2" opacity="0.3"/>
      <line x1="-54" y1="0" x2="186" y2="240" stroke="#BF8A50" stroke-width="2.2" opacity="0.3"/>
      <line x1="-36" y1="0" x2="204" y2="240" stroke="#BF8A50" stroke-width="2.2" opacity="0.3"/>
      <line x1="-18" y1="0" x2="222" y2="240" stroke="#BF8A50" stroke-width="2.2" opacity="0.3"/>
      <line x1="0" y1="0" x2="240" y2="240" stroke="#BF8A50" stroke-width="2.2" opacity="0.3"/>
      <line x1="18" y1="0" x2="258" y2="240" stroke="#BF8A50" stroke-width="2.2" opacity="0.3"/>
      <line x1="36" y1="0" x2="276" y2="240" stroke="#BF8A50" stroke-width="2.2" opacity="0.3"/>
      <line x1="54" y1="0" x2="294" y2="240" stroke="#BF8A50" stroke-width="2.2" opacity="0.3"/>
      <line x1="72" y1="0" x2="312" y2="240" stroke="#BF8A50" stroke-width="2.2" opacity="0.3"/>
      <line x1="90" y1="0" x2="330" y2="240" stroke="#BF8A50" stroke-width="2.2" opacity="0.3"/>
      <line x1="108" y1="0" x2="348" y2="240" stroke="#BF8A50" stroke-width="2.2" opacity="0.3"/>
      <line x1="126" y1="0" x2="366" y2="240" stroke="#BF8A50" stroke-width="2.2" opacity="0.3"/>
      <line x1="144" y1="0" x2="384" y2="240" stroke="#BF8A50" stroke-width="2.2" opacity="0.3"/>
      <line x1="162" y1="0" x2="402" y2="240" stroke="#BF8A50" stroke-width="2.2" opacity="0.3"/>
      <line x1="180" y1="0" x2="420" y2="240" stroke="#BF8A50" stroke-width="2.2" opacity="0.3"/>
      <line x1="198" y1="0" x2="438" y2="240" stroke="#BF8A50" stroke-width="2.2" opacity="0.3"/>
      <line x1="216" y1="0" x2="456" y2="240" stroke="#BF8A50" stroke-width="2.2" opacity="0.3"/>
      <line x1="234" y1="0" x2="474" y2="240" stroke="#BF8A50" stroke-width="2.2" opacity="0.3"/>
      <line x1="252" y1="0" x2="492" y2="240" stroke="#BF8A50" stroke-width="2.2" opacity="0.3"/>
      <line x1="270" y1="0" x2="510" y2="240" stroke="#BF8A50" stroke-width="2.2" opacity="0.3"/>
      <line x1="288" y1="0" x2="528" y2="240" stroke="#BF8A50" stroke-width="2.2" opacity="0.3"/>
      <line x1="306" y1="0" x2="546" y2="240" stroke="#BF8A50" stroke-width="2.2" opacity="0.3"/>
      <line x1="324" y1="0" x2="564" y2="240" stroke="#BF8A50" stroke-width="2.2" opacity="0.3"/>
      <line x1="342" y1="0" x2="582" y2="240" stroke="#BF8A50" stroke-width="2.2" opacity="0.3"/>
      <line x1="360" y1="0" x2="600" y2="240" stroke="#BF8A50" stroke-width="2.2" opacity="0.3"/>
      <line x1="378" y1="0" x2="618" y2="240" stroke="#BF8A50" stroke-width="2.2" opacity="0.3"/>
      <line x1="396" y1="0" x2="636" y2="240" stroke="#BF8A50" stroke-width="2.2" opacity="0.3"/>
      <line x1="414" y1="0" x2="654" y2="240" stroke="#BF8A50" stroke-width="2.2" opacity="0.3"/>
      <line x1="432" y1="0" x2="672" y2="240" stroke="#BF8A50" stroke-width="2.2" opacity="0.3"/>
      <line x1="450" y1="0" x2="690" y2="240" stroke="#BF8A50" stroke-width="2.2" opacity="0.3"/>
      <line x1="468" y1="0" x2="708" y2="240" stroke="#BF8A50" stroke-width="2.2" opacity="0.3"/>
      <line x1="486" y1="0" x2="726" y2="240" stroke="#BF8A50" stroke-width="2.2" opacity="0.3"/>
      <line x1="504" y1="0" x2="744" y2="240" stroke="#BF8A50" stroke-width="2.2" opacity="0.3"/>
      <line x1="522" y1="0" x2="762" y2="240" stroke="#BF8A50" stroke-width="2.2" opacity="0.3"/>
      <line x1="540" y1="0" x2="780" y2="240" stroke="#BF8A50" stroke-width="2.2" opacity="0.3"/>
    <rect width="520" height="240" fill="url(#hfade_calendar)"/>
  </g>

  <!-- paper texture -->
  <rect width="520" height="240" fill="#F0EBE0" filter="url(#tex)" opacity="0.04"/>

  <!-- icon -->
  <g transform="translate(420,120)">
  <!-- calendar body -->
  <rect x="-42" y="-36" width="84" height="84" rx="6" fill="#BF8A50" opacity="0.25"/>
  <rect x="-42" y="-36" width="84" height="84" rx="6" fill="none" stroke="#985A28" stroke-width="3.5"/>
  <!-- header band -->
  <rect x="-42" y="-36" width="84" height="26" rx="6" fill="#985A28" opacity="0.3"/>
  <rect x="-42" y="-16" width="84" height="6" fill="#985A28" opacity="0.3"/>
  <!-- ring hooks -->
  <line x1="-20" y1="-48" x2="-20" y2="-26" stroke="#985A28" stroke-width="4.5" stroke-linecap="round"/>
  <line x1="20" y1="-48" x2="20" y2="-26" stroke="#985A28" stroke-width="4.5" stroke-linecap="round"/>
  <!-- day grid dots/numbers -->
  <circle cx="-28" cy="4" r="4.5" fill="#985A28" opacity="0.45"/>
  <circle cx="-14" cy="4" r="4.5" fill="#985A28" opacity="0.45"/>
  <circle cx="0" cy="4" r="4.5" fill="#985A28" opacity="0.45"/>
  <circle cx="14" cy="4" r="4.5" fill="#985A28" opacity="0.45"/>
  <circle cx="28" cy="4" r="4.5" fill="#985A28" opacity="0.45"/>
  <circle cx="-28" cy="22" r="4.5" fill="#985A28" opacity="0.45"/>
  <circle cx="-14" cy="22" r="4.5" fill="#985A28" opacity="0.45"/>
  <!-- highlighted today -->
  <circle cx="0" cy="22" r="8" fill="#985A28" opacity="0.75"/>
  <circle cx="14" cy="22" r="4.5" fill="#985A28" opacity="0.45"/>
  <circle cx="28" cy="22" r="4.5" fill="#985A28" opacity="0.45"/>
  <circle cx="-28" cy="40" r="4.5" fill="#985A28" opacity="0.45"/>
  <circle cx="-14" cy="40" r="4.5" fill="#985A28" opacity="0.45"/>
  <circle cx="0" cy="40" r="4.5" fill="#985A28" opacity="0.45"/>
</g>

  <!-- border -->
  <rect width="520" height="240" fill="none" stroke="#BF8A50" stroke-width="1" opacity="0.3"/>
</svg>