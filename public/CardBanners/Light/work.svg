  <!-- briefcase body -->
  <rect x="-44" y="-18" width="88" height="60" rx="9" fill="#78AABB" opacity="0.28"/>
  <rect x="-44" y="-18" width="88" height="60" rx="9" fill="none" stroke="#4A7A8A" stroke-width="3.5"/>
