  <line x1="8" y1="3" x2="44" y2="3" stroke="#4A7A8A" stroke-width="2.5" opacity="0.6"/>
  <!-- clasp -->
  <rect x="-8" y="-3" width="16" height="13" rx="3" fill="#4A7A8A" opacity="0.9"/>
