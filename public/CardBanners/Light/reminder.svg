<svg xmlns="http://www.w3.org/2000/svg" width="520" height="240" viewBox="0 0 520 240">
  <defs>
    <filter id="tex_reminder_light" x="0%" y="0%" width="100%" height="100%" color-interpolation-filters="linearRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="4" seed="12" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0" result="gn"/>
      <feBlend in="SourceGraphic" in2="gn" mode="overlay"/>
    </filter>
    <linearGradient id="hfade_reminder_light" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"  stop-color="#F5EAE8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#F5EAE8" stop-opacity="0"/>
      <stop offset="82%" stop-color="#F5EAE8" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#F5EAE8" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="vign_reminder_light" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#A04838" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#A04838" stop-opacity="0.09"/>
    </linearGradient>
    <linearGradient id="diag_reminder_light" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C87060" stop-opacity="0"/>
      <stop offset="50%" stop-color="#C87060" stop-opacity="0"/>
      <stop offset="100%" stop-color="#C87060" stop-opacity="0.12"/>
    </linearGradient>
  </defs>

  <!-- base -->
  <rect width="520" height="240" fill="#F5EAE8"/>
  <rect width="520" height="240" fill="url(#vign_reminder_light)"/>

  <!-- diagonal sheen -->
  <rect width="520" height="240" fill="url(#diag_reminder_light)"/>
  <rect width="520" height="240" fill="url(#hfade_reminder_light)"/>

  <!-- paper texture -->
  <rect width="520" height="240" fill="#F5EAE8" filter="url(#tex_reminder_light)" opacity="0.06"/>

  <!-- icon -->
  <g transform="translate(420,120)">
  <!-- ringing arcs -->
  <path d="M-34,-28 a24,24 0 0 1 9,-13" fill="none" stroke="#A04838" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  <path d="M34,-28 a24,24 0 0 0 -9,-13" fill="none" stroke="#A04838" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  <!-- top nub -->
  <circle cx="0" cy="-40" r="4.5" fill="#A04838" opacity="0.9"/>
  <!-- bell body -->
  <path d="M0,-38 C-16,-38 -27,-26 -27,-6 L-27,8 C-27,14 -30,18 -35,22 L35,22 C30,18 27,14 27,8 L27,-6 C27,-26 16,-38 0,-38 Z" fill="#C87060" opacity="0.28"/>
  <path d="M0,-38 C-16,-38 -27,-26 -27,-6 L-27,8 C-27,14 -30,18 -35,22 L35,22 C30,18 27,14 27,8 L27,-6 C27,-26 16,-38 0,-38 Z" fill="none" stroke="#A04838" stroke-width="3.5" stroke-linejoin="round"/>
  <!-- clapper -->
  <path d="M-9,28 a9,9 0 0 0 18,0 Z" fill="#A04838" opacity="0.9"/>
  </g>

  <!-- border -->
  <rect width="520" height="240" fill="none" stroke="#C87060" stroke-width="1" opacity="0.3"/>
</svg>
