<svg xmlns="http://www.w3.org/2000/svg" width="520" height="240" viewBox="0 0 520 240">
  <defs>
    <filter id="tex_household_light" x="0%" y="0%" width="100%" height="100%" color-interpolation-filters="linearRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="4" seed="12" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0" result="gn"/>
      <feBlend in="SourceGraphic" in2="gn" mode="overlay"/>
    </filter>
    <linearGradient id="hfade_household_light" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"  stop-color="#F0EBDA" stop-opacity="0"/>
      <stop offset="50%" stop-color="#F0EBDA" stop-opacity="0"/>
      <stop offset="82%" stop-color="#F0EBDA" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#F0EBDA" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="vign_household_light" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#906030" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#906030" stop-opacity="0.09"/>
    </linearGradient>
    <linearGradient id="diag_household_light" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#B88858" stop-opacity="0"/>
      <stop offset="50%" stop-color="#B88858" stop-opacity="0"/>
      <stop offset="100%" stop-color="#B88858" stop-opacity="0.12"/>
    </linearGradient>
  </defs>

  <!-- base -->
  <rect width="520" height="240" fill="#F0EBDA"/>
  <rect width="520" height="240" fill="url(#vign_household_light)"/>

  <!-- diagonal sheen -->
  <rect width="520" height="240" fill="url(#diag_household_light)"/>
  <rect width="520" height="240" fill="url(#hfade_household_light)"/>

  <!-- paper texture -->
  <rect width="520" height="240" fill="#F0EBDA" filter="url(#tex_household_light)" opacity="0.06"/>

  <!-- icon -->
  <g transform="translate(420,120)">
  <!-- house body -->
  <rect x="-34" y="4" width="68" height="40" fill="#B88858" opacity="0.28"/>
  <rect x="-34" y="4" width="68" height="40" fill="none" stroke="#906030" stroke-width="3.5"/>
  <!-- roof -->
  <path d="M-46,4 L0,-40 L46,4 Z" fill="#B88858" opacity="0.28"/>
  <path d="M-46,4 L0,-40 L46,4" fill="none" stroke="#906030" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- chimney -->
  <path d="M22,-34 L34,-34 L34,-7.5 L22,-19 Z" fill="#906030" opacity="0.75"/>
  <!-- door -->
  <rect x="-9" y="20" width="18" height="24" rx="3" fill="#906030" opacity="0.7"/>
  <!-- windows -->
  <rect x="-27" y="14" width="14" height="13" rx="2" fill="#906030" opacity="0.3"/>
  <rect x="-27" y="14" width="14" height="13" rx="2" fill="none" stroke="#906030" stroke-width="2.5"/>
  <rect x="13" y="14" width="14" height="13" rx="2" fill="#906030" opacity="0.3"/>
  <rect x="13" y="14" width="14" height="13" rx="2" fill="none" stroke="#906030" stroke-width="2.5"/>
  </g>

  <!-- border -->
  <rect width="520" height="240" fill="none" stroke="#B88858" stroke-width="1" opacity="0.3"/>
</svg>
