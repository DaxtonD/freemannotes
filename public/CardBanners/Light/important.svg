<svg xmlns="http://www.w3.org/2000/svg" width="520" height="240" viewBox="0 0 520 240">
  <defs>
    <filter id="tex_important_light" x="0%" y="0%" width="100%" height="100%" color-interpolation-filters="linearRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="4" seed="12" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0" result="gn"/>
      <feBlend in="SourceGraphic" in2="gn" mode="overlay"/>
    </filter>
    <linearGradient id="hfade_important_light" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"  stop-color="#F5E8E5" stop-opacity="0"/>
      <stop offset="50%" stop-color="#F5E8E5" stop-opacity="0"/>
      <stop offset="82%" stop-color="#F5E8E5" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#F5E8E5" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="vign_important_light" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#B04038" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#B04038" stop-opacity="0.09"/>
    </linearGradient>
    <linearGradient id="diag_important_light" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D07060" stop-opacity="0"/>
      <stop offset="50%" stop-color="#D07060" stop-opacity="0"/>
      <stop offset="100%" stop-color="#D07060" stop-opacity="0.12"/>
    </linearGradient>
  </defs>

  <!-- base -->
  <rect width="520" height="240" fill="#F5E8E5"/>
  <rect width="520" height="240" fill="url(#vign_important_light)"/>

  <!-- diagonal sheen -->
  <rect width="520" height="240" fill="url(#diag_important_light)"/>
  <rect width="520" height="240" fill="url(#hfade_important_light)"/>

  <!-- paper texture -->
  <rect width="520" height="240" fill="#F5E8E5" filter="url(#tex_important_light)" opacity="0.06"/>

  <!-- icon -->
  <g transform="translate(420,120)">
  <!-- warning triangle -->
  <path d="M0,-38 L42,34 L-42,34 Z" fill="#D07060" opacity="0.28"/>
  <path d="M0,-38 L42,34 L-42,34 Z" fill="none" stroke="#B04038" stroke-width="7" stroke-linejoin="round"/>
  <!-- exclamation mark -->
  <line x1="0" y1="-12" x2="0" y2="10" stroke="#B04038" stroke-width="7" stroke-linecap="round"/>
  <circle cx="0" cy="22" r="4.5" fill="#B04038"/>
  </g>

  <!-- border -->
  <rect width="520" height="240" fill="none" stroke="#D07060" stroke-width="1" opacity="0.3"/>
</svg>
