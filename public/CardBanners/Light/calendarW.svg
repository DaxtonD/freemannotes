<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="240" viewBox="0 0 1000 240">
  <defs>
    <filter id="tex_calendar_light_w" x="0%" y="0%" width="100%" height="100%" color-interpolation-filters="linearRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="4" seed="12" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0" result="gn"/>
      <feBlend in="SourceGraphic" in2="gn" mode="overlay"/>
    </filter>
    <linearGradient id="hfade_calendar_light_w" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"  stop-color="#F0EBE0" stop-opacity="0"/>
      <stop offset="50%" stop-color="#F0EBE0" stop-opacity="0"/>
      <stop offset="82%" stop-color="#F0EBE0" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#F0EBE0" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="vign_calendar_light_w" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#985A28" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#985A28" stop-opacity="0.09"/>
    </linearGradient>
    <linearGradient id="diag_calendar_light_w" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#BF8A50" stop-opacity="0"/>
      <stop offset="50%" stop-color="#BF8A50" stop-opacity="0"/>
      <stop offset="100%" stop-color="#BF8A50" stop-opacity="0.12"/>
    </linearGradient>
  </defs>

  <!-- base -->
  <rect width="1000" height="240" fill="#F0EBE0"/>
  <rect width="1000" height="240" fill="url(#vign_calendar_light_w)"/>

  <!-- diagonal sheen -->
  <rect width="1000" height="240" fill="url(#diag_calendar_light_w)"/>
  <rect width="1000" height="240" fill="url(#hfade_calendar_light_w)"/>

  <!-- paper texture -->
  <rect width="1000" height="240" fill="#F0EBE0" filter="url(#tex_calendar_light_w)" opacity="0.06"/>

  <!-- icon -->
  <g transform="translate(880,120) scale(0.6)">
  <!-- calendar body -->
  <rect x="-44" y="-30" width="88" height="74" rx="8" fill="#BF8A50" opacity="0.28"/>
  <rect x="-44" y="-30" width="88" height="74" rx="8" fill="none" stroke="#985A28" stroke-width="3.5"/>
  <!-- header band -->
  <path d="M-36,-30 h72 a8,8 0 0 1 8,8 v15 h-88 v-15 a8,8 0 0 1 8,-8 Z" fill="#985A28" opacity="0.4"/>
  <!-- ring hooks -->
  <line x1="-22" y1="-40" x2="-22" y2="-22" stroke="#985A28" stroke-width="5" stroke-linecap="round"/>
  <line x1="22" y1="-40" x2="22" y2="-22" stroke="#985A28" stroke-width="5" stroke-linecap="round"/>
  <!-- day grid -->
  <rect x="-35" y="-2" width="11" height="11" rx="3" fill="#985A28" opacity="0.4"/>
  <rect x="-15" y="-2" width="11" height="11" rx="3" fill="#985A28" opacity="0.4"/>
  <rect x="5" y="-2" width="11" height="11" rx="3" fill="#985A28" opacity="0.4"/>
  <rect x="25" y="-2" width="11" height="11" rx="3" fill="#985A28" opacity="0.4"/>
  <rect x="-35" y="14" width="11" height="11" rx="3" fill="#985A28" opacity="0.4"/>
  <rect x="-15" y="14" width="11" height="11" rx="3" fill="#985A28" opacity="0.4"/>
  <rect x="5" y="14" width="11" height="11" rx="3" fill="#985A28" opacity="0.9"/>
  <rect x="25" y="14" width="11" height="11" rx="3" fill="#985A28" opacity="0.4"/>
  <rect x="-35" y="30" width="11" height="11" rx="3" fill="#985A28" opacity="0.4"/>
  <rect x="-15" y="30" width="11" height="11" rx="3" fill="#985A28" opacity="0.4"/>
  <rect x="5" y="30" width="11" height="11" rx="3" fill="#985A28" opacity="0.4"/>
  <rect x="25" y="30" width="11" height="11" rx="3" fill="#985A28" opacity="0.4"/>
  </g>

  <!-- border -->
  <rect width="1000" height="240" fill="none" stroke="#BF8A50" stroke-width="1" opacity="0.3"/>
</svg>
