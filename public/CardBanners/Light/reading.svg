      <line x1="540" y1="0" x2="780" y2="240" stroke="#68AA88" stroke-width="2.2" opacity="0.3"/>
    <rect width="520" height="240" fill="url(#hfade_reading)"/>
  </g>

  <!-- paper texture -->
  <rect width="520" height="240" fill="#EBF2EE" filter="url(#tex)" opacity="0.04"/>

  <!-- icon -->
  <g transform="translate(420,120)">
  <!-- reading glasses -->
  <circle cx="-16" cy="-36" r="13" fill="none" stroke="#3A7A5A" stroke-width="3"/>
  <circle cx="16" cy="-36" r="13" fill="none" stroke="#3A7A5A" stroke-width="3"/>
  <line x1="-3" y1="-36" x2="3" y2="-36" stroke="#3A7A5A" stroke-width="3"/>
  <line x1="-42" y1="-32" x2="-29" y2="-32" stroke="#3A7A5A" stroke-width="3" stroke-linecap="round"/>
  <line x1="42" y1="-32" x2="29" y2="-32" stroke="#3A7A5A" stroke-width="3" stroke-linecap="round"/>
  <!-- open book pages left -->
  <path d="M-4,-10 L-44,-18 Q-48,-18 -48,-14 L-48,42 Q-48,46 -44,44 L-4,36 Z" fill="#68AA88" opacity="0.3"/>
  <path d="M-4,-10 L-44,-18 Q-48,-18 -48,-14 L-48,42 Q-48,46 -44,44 L-4,36 Z" fill="none" stroke="#3A7A5A" stroke-width="3"/>
  <!-- open book pages right -->
  <path d="M4,-10 L44,-18 Q48,-18 48,-14 L48,42 Q48,46 44,44 L4,36 Z" fill="#68AA88" opacity="0.22"/>
  <path d="M4,-10 L44,-18 Q48,-18 48,-14 L48,42 Q48,46 44,44 L4,36 Z" fill="none" stroke="#3A7A5A" stroke-width="3"/>
  <!-- spine -->
  <line x1="-4" y1="-10" x2="-4" y2="36" stroke="#3A7A5A" stroke-width="3.5"/>
  <line x1="4" y1="-10" x2="4" y2="36" stroke="#3A7A5A" stroke-width="3.5"/>
  <!-- text lines left -->
  <line x1="-36" y1="-2" x2="-10" y2="-4" stroke="#3A7A5A" stroke-width="2" opacity="0.45"/>
  <line x1="-36" y1="10" x2="-10" y2="8" stroke="#3A7A5A" stroke-width="2" opacity="0.45"/>
  <line x1="-36" y1="22" x2="-10" y2="22" stroke="#3A7A5A" stroke-width="2" opacity="0.45"/>
  <line x1="-36" y1="34" x2="-20" y2="34" stroke="#3A7A5A" stroke-width="2" opacity="0.45"/>
  <!-- text lines right -->
  <line x1="10" y1="-2" x2="36" y2="-4" stroke="#3A7A5A" stroke-width="2" opacity="0.45"/>
  <line x1="10" y1="10" x2="36" y2="8" stroke="#3A7A5A" stroke-width="2" opacity="0.45"/>
  <line x1="10" y1="22" x2="36" y2="22" stroke="#3A7A5A" stroke-width="2" opacity="0.45"/>
</g>

  <!-- border -->
  <rect width="520" height="240" fill="none" stroke="#68AA88" stroke-width="1" opacity="0.3"/>
</svg>