<svg xmlns="http://www.w3.org/2000/svg" width="520" height="240" viewBox="0 0 520 240">
  <defs>
    <filter id="tex_reading_light" x="0%" y="0%" width="100%" height="100%" color-interpolation-filters="linearRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="4" seed="12" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0" result="gn"/>
      <feBlend in="SourceGraphic" in2="gn" mode="overlay"/>
    </filter>
    <linearGradient id="hfade_reading_light" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"  stop-color="#EBF2EE" stop-opacity="0"/>
      <stop offset="50%" stop-color="#EBF2EE" stop-opacity="0"/>
      <stop offset="82%" stop-color="#EBF2EE" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#EBF2EE" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="vign_reading_light" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#3A7A5A" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#3A7A5A" stop-opacity="0.09"/>
    </linearGradient>
    <linearGradient id="diag_reading_light" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#68AA88" stop-opacity="0"/>
      <stop offset="50%" stop-color="#68AA88" stop-opacity="0"/>
      <stop offset="100%" stop-color="#68AA88" stop-opacity="0.12"/>
    </linearGradient>
  </defs>

  <!-- base -->
  <rect width="520" height="240" fill="#EBF2EE"/>
  <rect width="520" height="240" fill="url(#vign_reading_light)"/>

  <!-- diagonal sheen -->
  <rect width="520" height="240" fill="url(#diag_reading_light)"/>
  <rect width="520" height="240" fill="url(#hfade_reading_light)"/>

  <!-- paper texture -->
  <rect width="520" height="240" fill="#EBF2EE" filter="url(#tex_reading_light)" opacity="0.06"/>

  <!-- icon -->
  <g transform="translate(420,120)">
  <!-- open book left page -->
  <path d="M0,-26 C-10,-35 -26,-38 -42,-35 L-42,30 C-26,27 -10,30 0,38 Z" fill="#68AA88" opacity="0.28"/>
  <path d="M0,-26 C-10,-35 -26,-38 -42,-35 L-42,30 C-26,27 -10,30 0,38 Z" fill="none" stroke="#3A7A5A" stroke-width="3.5" stroke-linejoin="round"/>
  <!-- right page -->
  <path d="M0,-26 C10,-35 26,-38 42,-35 L42,30 C26,27 10,30 0,38 Z" fill="#68AA88" opacity="0.28"/>
  <path d="M0,-26 C10,-35 26,-38 42,-35 L42,30 C26,27 10,30 0,38 Z" fill="none" stroke="#3A7A5A" stroke-width="3.5" stroke-linejoin="round"/>
  <!-- text lines -->
  <line x1="-33" y1="-20" x2="-9" y2="-16" stroke="#3A7A5A" stroke-width="2.5" stroke-linecap="round" opacity="0.5"/>
  <line x1="-33" y1="-9" x2="-9" y2="-5" stroke="#3A7A5A" stroke-width="2.5" stroke-linecap="round" opacity="0.5"/>
  <line x1="-33" y1="2" x2="-9" y2="6" stroke="#3A7A5A" stroke-width="2.5" stroke-linecap="round" opacity="0.5"/>
  <line x1="-33" y1="13" x2="-9" y2="17" stroke="#3A7A5A" stroke-width="2.5" stroke-linecap="round" opacity="0.5"/>
  <line x1="33" y1="-20" x2="9" y2="-16" stroke="#3A7A5A" stroke-width="2.5" stroke-linecap="round" opacity="0.5"/>
  <line x1="33" y1="-9" x2="9" y2="-5" stroke="#3A7A5A" stroke-width="2.5" stroke-linecap="round" opacity="0.5"/>
  <line x1="33" y1="2" x2="9" y2="6" stroke="#3A7A5A" stroke-width="2.5" stroke-linecap="round" opacity="0.5"/>
  <line x1="33" y1="13" x2="9" y2="17" stroke="#3A7A5A" stroke-width="2.5" stroke-linecap="round" opacity="0.5"/>
  </g>

  <!-- border -->
  <rect width="520" height="240" fill="none" stroke="#68AA88" stroke-width="1" opacity="0.3"/>
</svg>
