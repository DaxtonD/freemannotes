  <!-- graduation cap top (mortarboard) -->
  <polygon points="0,-52 -44,-28 0,-12 44,-28" fill="#4A8A5A" opacity="0.45"/>
  <polygon points="0,-52 -44,-28 0,-12 44,-28" fill="none" stroke="#4A8A5A" stroke-width="3"/>
  <!-- cap base cylinder -->
  <path d="M-22,-20 Q-22,0 0,4 Q22,0 22,-20" fill="#72B082" opacity="0.3"/>
  <path d="M-22,-20 Q-22,0 0,4 Q22,0 22,-20" fill="none" stroke="#4A8A5A" stroke-width="2.8"/>
