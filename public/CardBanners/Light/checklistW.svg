<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="240" viewBox="0 0 1000 240">
  <defs>
    <filter id="tex_checklist_light_w" x="0%" y="0%" width="100%" height="100%" color-interpolation-filters="linearRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="4" seed="12" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0" result="gn"/>
      <feBlend in="SourceGraphic" in2="gn" mode="overlay"/>
    </filter>
    <linearGradient id="hfade_checklist_light_w" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"  stop-color="#EDEEF5" stop-opacity="0"/>
      <stop offset="50%" stop-color="#EDEEF5" stop-opacity="0"/>
      <stop offset="82%" stop-color="#EDEEF5" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#EDEEF5" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="vign_checklist_light_w" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#6070A0" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#6070A0" stop-opacity="0.09"/>
    </linearGradient>
    <linearGradient id="diag_checklist_light_w" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8898C8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#8898C8" stop-opacity="0"/>
      <stop offset="100%" stop-color="#8898C8" stop-opacity="0.12"/>
    </linearGradient>
  </defs>

  <!-- base -->
  <rect width="1000" height="240" fill="#EDEEF5"/>
  <rect width="1000" height="240" fill="url(#vign_checklist_light_w)"/>

  <!-- diagonal sheen -->
  <rect width="1000" height="240" fill="url(#diag_checklist_light_w)"/>
  <rect width="1000" height="240" fill="url(#hfade_checklist_light_w)"/>

  <!-- paper texture -->
  <rect width="1000" height="240" fill="#EDEEF5" filter="url(#tex_checklist_light_w)" opacity="0.06"/>

  <!-- icon -->
  <g transform="translate(880,120) scale(0.6)">
  <!-- clipboard body -->
  <rect x="-34" y="-42" width="68" height="86" rx="8" fill="#8898C8" opacity="0.28"/>
  <rect x="-34" y="-42" width="68" height="86" rx="8" fill="none" stroke="#6070A0" stroke-width="3.5"/>
  <!-- clip top -->
  <rect x="-14" y="-48" width="28" height="12" rx="5" fill="#6070A0" opacity="0.9"/>
  <!-- row 1 checked -->
  <rect x="-24" y="-28" width="14" height="14" rx="3.5" fill="#6070A0" opacity="0.35"/>
  <rect x="-24" y="-28" width="14" height="14" rx="3.5" fill="none" stroke="#6070A0" stroke-width="2.5"/>
  <path d="M-21,-21 l3.5,3.5 l6.5,-7.5" fill="none" stroke="#6070A0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="-3" y1="-21" x2="24" y2="-21" stroke="#6070A0" stroke-width="3.5" stroke-linecap="round" opacity="0.55"/>
  <!-- row 2 checked -->
  <rect x="-24" y="-5" width="14" height="14" rx="3.5" fill="#6070A0" opacity="0.35"/>
  <rect x="-24" y="-5" width="14" height="14" rx="3.5" fill="none" stroke="#6070A0" stroke-width="2.5"/>
  <path d="M-21,2 l3.5,3.5 l6.5,-7.5" fill="none" stroke="#6070A0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="-3" y1="2" x2="18" y2="2" stroke="#6070A0" stroke-width="3.5" stroke-linecap="round" opacity="0.55"/>
  <!-- row 3 unchecked -->
  <rect x="-24" y="18" width="14" height="14" rx="3.5" fill="none" stroke="#6070A0" stroke-width="2.5"/>
  <line x1="-3" y1="25" x2="22" y2="25" stroke="#6070A0" stroke-width="3.5" stroke-linecap="round" opacity="0.55"/>
  </g>

  <!-- border -->
  <rect width="1000" height="240" fill="none" stroke="#8898C8" stroke-width="1" opacity="0.3"/>
</svg>
