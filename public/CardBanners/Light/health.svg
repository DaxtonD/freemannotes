<svg xmlns="http://www.w3.org/2000/svg" width="520" height="240" viewBox="0 0 520 240">
  <defs>
    <filter id="tex_health_light" x="0%" y="0%" width="100%" height="100%" color-interpolation-filters="linearRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="4" seed="12" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0" result="gn"/>
      <feBlend in="SourceGraphic" in2="gn" mode="overlay"/>
    </filter>
    <linearGradient id="hfade_health_light" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"  stop-color="#F5EAEC" stop-opacity="0"/>
      <stop offset="50%" stop-color="#F5EAEC" stop-opacity="0"/>
      <stop offset="82%" stop-color="#F5EAEC" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#F5EAEC" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="vign_health_light" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#A04858" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#A04858" stop-opacity="0.09"/>
    </linearGradient>
    <linearGradient id="diag_health_light" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C87888" stop-opacity="0"/>
      <stop offset="50%" stop-color="#C87888" stop-opacity="0"/>
      <stop offset="100%" stop-color="#C87888" stop-opacity="0.12"/>
    </linearGradient>
  </defs>

  <!-- base -->
  <rect width="520" height="240" fill="#F5EAEC"/>
  <rect width="520" height="240" fill="url(#vign_health_light)"/>

  <!-- diagonal sheen -->
  <rect width="520" height="240" fill="url(#diag_health_light)"/>
  <rect width="520" height="240" fill="url(#hfade_health_light)"/>

  <!-- paper texture -->
  <rect width="520" height="240" fill="#F5EAEC" filter="url(#tex_health_light)" opacity="0.06"/>

  <!-- icon -->
  <g transform="translate(420,120)">
  <!-- heart -->
  <path d="M0,36 C-8,28 -42,8 -42,-14 C-42,-32 -28,-42 -14,-40 C-6,-39 -2,-34 0,-30 C2,-34 6,-39 14,-40 C28,-42 42,-32 42,-14 C42,8 8,28 0,36 Z" fill="#C87888" opacity="0.28"/>
  <path d="M0,36 C-8,28 -42,8 -42,-14 C-42,-32 -28,-42 -14,-40 C-6,-39 -2,-34 0,-30 C2,-34 6,-39 14,-40 C28,-42 42,-32 42,-14 C42,8 8,28 0,36 Z" fill="none" stroke="#A04858" stroke-width="3.5" stroke-linejoin="round"/>
  <!-- pulse -->
  <path d="M-30,-2 H-14 L-8,-12 L2,12 L8,-4 L12,2 H30" fill="none" stroke="#A04858" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- border -->
  <rect width="520" height="240" fill="none" stroke="#C87888" stroke-width="1" opacity="0.3"/>
</svg>
