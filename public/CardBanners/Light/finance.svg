      <line x1="-54" y1="0" x2="186" y2="240" stroke="#96AA54" stroke-width="2.2" opacity="0.3"/>
      <line x1="-36" y1="0" x2="204" y2="240" stroke="#96AA54" stroke-width="2.2" opacity="0.3"/>
      <line x1="-18" y1="0" x2="222" y2="240" stroke="#96AA54" stroke-width="2.2" opacity="0.3"/>
      <line x1="0" y1="0" x2="240" y2="240" stroke="#96AA54" stroke-width="2.2" opacity="0.3"/>
      <line x1="18" y1="0" x2="258" y2="240" stroke="#96AA54" stroke-width="2.2" opacity="0.3"/>
