<svg xmlns="http://www.w3.org/2000/svg" width="520" height="240" viewBox="0 0 520 240">
  <defs>
    <filter id="tex_finance_light" x="0%" y="0%" width="100%" height="100%" color-interpolation-filters="linearRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="4" seed="12" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0" result="gn"/>
      <feBlend in="SourceGraphic" in2="gn" mode="overlay"/>
    </filter>
    <linearGradient id="hfade_finance_light" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"  stop-color="#EEF0E5" stop-opacity="0"/>
      <stop offset="50%" stop-color="#EEF0E5" stop-opacity="0"/>
      <stop offset="82%" stop-color="#EEF0E5" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#EEF0E5" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="vign_finance_light" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#6A7A30" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#6A7A30" stop-opacity="0.09"/>
    </linearGradient>
    <linearGradient id="diag_finance_light" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#96AA54" stop-opacity="0"/>
      <stop offset="50%" stop-color="#96AA54" stop-opacity="0"/>
      <stop offset="100%" stop-color="#96AA54" stop-opacity="0.12"/>
    </linearGradient>
  </defs>

  <!-- base -->
  <rect width="520" height="240" fill="#EEF0E5"/>
  <rect width="520" height="240" fill="url(#vign_finance_light)"/>

  <!-- diagonal sheen -->
  <rect width="520" height="240" fill="url(#diag_finance_light)"/>
  <rect width="520" height="240" fill="url(#hfade_finance_light)"/>

  <!-- paper texture -->
  <rect width="520" height="240" fill="#EEF0E5" filter="url(#tex_finance_light)" opacity="0.06"/>

  <!-- icon -->
  <g transform="translate(420,120)">
  <!-- axes -->
  <path d="M-42,-38 V36 H44" fill="none" stroke="#6A7A30" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- rising bars -->
  <rect x="-33" y="16" width="13" height="20" rx="3" fill="#6A7A30" opacity="0.4"/>
  <rect x="-13" y="4" width="13" height="32" rx="3" fill="#6A7A30" opacity="0.5"/>
  <rect x="7" y="-9" width="13" height="45" rx="3" fill="#6A7A30" opacity="0.6"/>
  <rect x="27" y="-22" width="13" height="58" rx="3" fill="#6A7A30" opacity="0.8"/>
  <!-- trend arrow -->
  <path d="M-33,-2 L-13,-14 L1,-6 L27,-25" fill="none" stroke="#6A7A30" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M38,-33 L23,-32 L32,-20 Z" fill="#6A7A30"/>
  </g>

  <!-- border -->
  <rect width="520" height="240" fill="none" stroke="#96AA54" stroke-width="1" opacity="0.3"/>
</svg>
