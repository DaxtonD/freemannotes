    <line x1="-144" y1="0" x2="96" y2="240" stroke="#96AA54" stroke-width="2.2" opacity="0.3"/>
      <line x1="-126" y1="0" x2="114" y2="240" stroke="#96AA54" stroke-width="2.2" opacity="0.3"/>
      <line x1="-108" y1="0" x2="132" y2="240" stroke="#96AA54" stroke-width="2.2" opacity="0.3"/>
