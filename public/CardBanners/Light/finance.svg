      <line x1="216" y1="0" x2="456" y2="240" stroke="#96AA54" stroke-width="2.2" opacity="0.3"/>
      <line x1="234" y1="0" x2="474" y2="240" stroke="#96AA54" stroke-width="2.2" opacity="0.3"/>
