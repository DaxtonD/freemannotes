      <line x1="540" y1="0" x2="780" y2="240" stroke="#96AA54" stroke-width="2.2" opacity="0.3"/>
    <rect width="520" height="240" fill="url(#hfade_finance)"/>
  </g>

  <!-- paper texture -->
  <rect width="520" height="240" fill="#EEF0E5" filter="url(#tex)" opacity="0.04"/>

  <!-- icon -->
  <g transform="translate(420,120)">
  <!-- wallet body -->
  <rect x="-38" y="-24" width="76" height="52" rx="7" fill="#96AA54" opacity="0.3"/>
  <rect x="-38" y="-24" width="76" height="52" rx="7" fill="none" stroke="#6A7A30" stroke-width="3.5"/>
  <!-- wallet flap top -->
  <path d="M-38,-24 L38,-24 L38,-8 Q38,4 24,4 L-38,4 Z" fill="#6A7A30" opacity="0.18"/>
  <line x1="-38" y1="4" x2="38" y2="4" stroke="#6A7A30" stroke-width="2.5"/>
  <!-- coin pocket -->
  <rect x="14" y="-18" width="22" height="34" rx="11" fill="none" stroke="#6A7A30" stroke-width="2.5"/>
  <circle cx="25" cy="-1" r="8" fill="#6A7A30" opacity="0.45"/>
  <text x="21" y="3" font-family="Georgia,serif" font-size="11" fill="#6A7A30" font-weight="bold" opacity="0.9">$</text>
  <!-- chart bars left -->
  <rect x="-34" y="0" width="8" height="20" rx="2" fill="#6A7A30" opacity="0.55"/>
  <rect x="-22" y="-8" width="8" height="28" rx="2" fill="#6A7A30" opacity="0.55"/>
  <rect x="-10" y="-4" width="8" height="24" rx="2" fill="#6A7A30" opacity="0.55"/>
</g>

  <!-- border -->
  <rect width="520" height="240" fill="none" stroke="#96AA54" stroke-width="1" opacity="0.3"/>
</svg>