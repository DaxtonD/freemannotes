      <line x1="72" y1="0" x2="312" y2="240" stroke="#96AA54" stroke-width="2.2" opacity="0.3"/>
      <line x1="90" y1="0" x2="330" y2="240" stroke="#96AA54" stroke-width="2.2" opacity="0.3"/>
      <line x1="108" y1="0" x2="348" y2="240" stroke="#96AA54" stroke-width="2.2" opacity="0.3"/>
      <line x1="126" y1="0" x2="366" y2="240" stroke="#96AA54" stroke-width="2.2" opacity="0.3"/>
