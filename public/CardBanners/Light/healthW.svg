<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="240" viewBox="0 0 1000 240">
  <defs>
    <filter id="tex_health_light_w" x="0%" y="0%" width="100%" height="100%" color-interpolation-filters="linearRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="4" seed="12" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0" result="gn"/>
      <feBlend in="SourceGraphic" in2="gn" mode="overlay"/>
    </filter>
    <linearGradient id="hfade_health_light_w" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"  stop-color="#F5EAEC" stop-opacity="0"/>
      <stop offset="50%" stop-color="#F5EAEC" stop-opacity="0"/>
      <stop offset="82%" stop-color="#F5EAEC" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#F5EAEC" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="vign_health_light_w" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#A04858" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#A04858" stop-opacity="0.09"/>
    </linearGradient>
  </defs>

