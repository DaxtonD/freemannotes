<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="240" viewBox="0 0 1000 240">
  <defs>
    <filter id="tex_recipes_light_w" x="0%" y="0%" width="100%" height="100%" color-interpolation-filters="linearRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="4" seed="12" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0" result="gn"/>
      <feBlend in="SourceGraphic" in2="gn" mode="overlay"/>
    </filter>
    <linearGradient id="hfade_recipes_light_w" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"  stop-color="#F5EDE5" stop-opacity="0"/>
      <stop offset="50%" stop-color="#F5EDE5" stop-opacity="0"/>
      <stop offset="82%" stop-color="#F5EDE5" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#F5EDE5" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="vign_recipes_light_w" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#A06840" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#A06840" stop-opacity="0.09"/>
    </linearGradient>
    <linearGradient id="diag_recipes_light_w" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#CC9068" stop-opacity="0"/>
      <stop offset="50%" stop-color="#CC9068" stop-opacity="0"/>
      <stop offset="100%" stop-color="#CC9068" stop-opacity="0.12"/>
    </linearGradient>
  </defs>

  <!-- base -->
  <rect width="1000" height="240" fill="#F5EDE5"/>
  <rect width="1000" height="240" fill="url(#vign_recipes_light_w)"/>

  <!-- diagonal sheen -->
  <rect width="1000" height="240" fill="url(#diag_recipes_light_w)"/>
  <rect width="1000" height="240" fill="url(#hfade_recipes_light_w)"/>

  <!-- paper texture -->
  <rect width="1000" height="240" fill="#F5EDE5" filter="url(#tex_recipes_light_w)" opacity="0.06"/>

  <!-- icon -->
  <g transform="translate(880,120) scale(0.6)">
  <!-- steam -->
  <path d="M-12,-46 c4,6 -4,10 0,16" fill="none" stroke="#A06840" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  <path d="M12,-46 c4,6 -4,10 0,16" fill="none" stroke="#A06840" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  <!-- lid -->
  <path d="M-38,-4 C-38,-18 -20,-26 0,-26 C20,-26 38,-18 38,-4 Z" fill="#CC9068" opacity="0.28"/>
  <path d="M-38,-4 C-38,-18 -20,-26 0,-26 C20,-26 38,-18 38,-4 Z" fill="none" stroke="#A06840" stroke-width="3.5" stroke-linejoin="round"/>
  <circle cx="0" cy="-30" r="4.5" fill="#A06840" opacity="0.9"/>
  <!-- pot body -->
  <rect x="-38" y="-2" width="76" height="42" rx="7" fill="#CC9068" opacity="0.28"/>
  <rect x="-38" y="-2" width="76" height="42" rx="7" fill="none" stroke="#A06840" stroke-width="3.5"/>
  <!-- handles -->
  <line x1="-39" y1="8" x2="-47" y2="8" stroke="#A06840" stroke-width="4.5" stroke-linecap="round"/>
  <line x1="39" y1="8" x2="47" y2="8" stroke="#A06840" stroke-width="4.5" stroke-linecap="round"/>
  </g>

  <!-- border -->
  <rect width="1000" height="240" fill="none" stroke="#CC9068" stroke-width="1" opacity="0.3"/>
</svg>
