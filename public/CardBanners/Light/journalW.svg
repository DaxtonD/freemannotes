<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="240" viewBox="0 0 1000 240">
  <defs>
    <filter id="tex_journal_light_w" x="0%" y="0%" width="100%" height="100%" color-interpolation-filters="linearRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="4" seed="12" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0" result="gn"/>
      <feBlend in="SourceGraphic" in2="gn" mode="overlay"/>
    </filter>
    <linearGradient id="hfade_journal_light_w" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"  stop-color="#EBF0E8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#EBF0E8" stop-opacity="0"/>
      <stop offset="82%" stop-color="#EBF0E8" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#EBF0E8" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="vign_journal_light_w" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#5A7848" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#5A7848" stop-opacity="0.09"/>
    </linearGradient>
    <linearGradient id="diag_journal_light_w" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#88A870" stop-opacity="0"/>
      <stop offset="50%" stop-color="#88A870" stop-opacity="0"/>
      <stop offset="100%" stop-color="#88A870" stop-opacity="0.12"/>
    </linearGradient>
  </defs>

  <!-- base -->
  <rect width="1000" height="240" fill="#EBF0E8"/>
  <rect width="1000" height="240" fill="url(#vign_journal_light_w)"/>

  <!-- diagonal sheen -->
  <rect width="1000" height="240" fill="url(#diag_journal_light_w)"/>
  <rect width="1000" height="240" fill="url(#hfade_journal_light_w)"/>

  <!-- paper texture -->
  <rect width="1000" height="240" fill="#EBF0E8" filter="url(#tex_journal_light_w)" opacity="0.06"/>

  <!-- icon -->
  <g transform="translate(880,120) scale(0.6)">
  <!-- notebook body -->
  <rect x="-36" y="-42" width="62" height="86" rx="6" fill="#88A870" opacity="0.28"/>
  <rect x="-36" y="-42" width="62" height="86" rx="6" fill="none" stroke="#5A7848" stroke-width="3.5"/>
  <!-- spiral rings -->
  <circle cx="-36" cy="-30" r="4" fill="none" stroke="#5A7848" stroke-width="2.5"/>
  <circle cx="-36" cy="-14" r="4" fill="none" stroke="#5A7848" stroke-width="2.5"/>
  <circle cx="-36" cy="2" r="4" fill="none" stroke="#5A7848" stroke-width="2.5"/>
  <circle cx="-36" cy="18" r="4" fill="none" stroke="#5A7848" stroke-width="2.5"/>
  <circle cx="-36" cy="34" r="4" fill="none" stroke="#5A7848" stroke-width="2.5"/>
  <!-- text lines -->
  <line x1="-24" y1="-26" x2="14" y2="-26" stroke="#5A7848" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
  <line x1="-24" y1="-13" x2="14" y2="-13" stroke="#5A7848" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
  <line x1="-24" y1="0" x2="8" y2="0" stroke="#5A7848" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
  <line x1="-24" y1="13" x2="2" y2="13" stroke="#5A7848" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
  <!-- pen -->
  <g transform="translate(34,2) rotate(20)">
    <rect x="-4.5" y="-30" width="9" height="48" rx="4" fill="#5A7848" opacity="0.9"/>
    <path d="M-4.5,18 L0,30 L4.5,18 Z" fill="#5A7848" opacity="0.9"/>
    <line x1="-4.5" y1="10" x2="4.5" y2="10" stroke="#88A870" stroke-width="2"/>
  </g>
  </g>

  <!-- border -->
  <rect width="1000" height="240" fill="none" stroke="#88A870" stroke-width="1" opacity="0.3"/>
</svg>
