<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="240" viewBox="0 0 1000 240">
  <defs>
    <filter id="tex_grocery_dark_w" x="0%" y="0%" width="100%" height="100%" color-interpolation-filters="linearRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.60" numOctaves="4" seed="12" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0" result="gn"/>
      <feBlend in="SourceGraphic" in2="gn" mode="overlay"/>
    </filter>
    <linearGradient id="hfade_grocery_dark_w" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"  stop-color="#2C1E0A" stop-opacity="0"/>
      <stop offset="50%" stop-color="#2C1E0A" stop-opacity="0"/>
      <stop offset="82%" stop-color="#2C1E0A" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#2C1E0A" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="vign_grocery_dark_w" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#D4924E" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#D4924E" stop-opacity="0.09"/>
    </linearGradient>
    <linearGradient id="diag_grocery_dark_w" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7A4A18" stop-opacity="0"/>
      <stop offset="50%" stop-color="#7A4A18" stop-opacity="0"/>
      <stop offset="100%" stop-color="#7A4A18" stop-opacity="0.18"/>
    </linearGradient>
  </defs>

  <!-- base -->
  <rect width="1000" height="240" fill="#2C1E0A"/>
  <rect width="1000" height="240" fill="url(#vign_grocery_dark_w)"/>

  <!-- diagonal sheen -->
  <rect width="1000" height="240" fill="url(#diag_grocery_dark_w)"/>
  <rect width="1000" height="240" fill="url(#hfade_grocery_dark_w)"/>

  <!-- paper texture -->
  <rect width="1000" height="240" fill="#2C1E0A" filter="url(#tex_grocery_dark_w)" opacity="0.06"/>

  <!-- icon -->
  <g transform="translate(880,120) scale(0.6)">
  <!-- celery stalks -->
  <g transform="rotate(-10,-16,-30)">
    <rect x="-19" y="-42" width="6" height="22" rx="3" fill="#D4924E" opacity="0.5"/>
  </g>
  <g transform="rotate(6,-8,-32)">
    <rect x="-11" y="-46" width="6" height="26" rx="3" fill="#D4924E" opacity="0.6"/>
  </g>
  <!-- baguette -->
  <g transform="rotate(18,14,-32)">
    <rect x="9" y="-44" width="11" height="26" rx="5.5" fill="#D4924E" opacity="0.75"/>
    <line x1="11" y1="-38" x2="17" y2="-40" stroke="#7A4A18" stroke-width="2" stroke-linecap="round"/>
    <line x1="12" y1="-31" x2="18" y2="-33" stroke="#7A4A18" stroke-width="2" stroke-linecap="round"/>
  </g>
  <!-- bag body -->
  <path d="M-30,-22 L-37,39 Q-37.6,44 -32.6,44 L32.6,44 Q37.6,44 37,39 L30,-22 Z" fill="#7A4A18" opacity="0.3"/>
  <path d="M-30,-22 L-37,39 Q-37.6,44 -32.6,44 L32.6,44 Q37.6,44 37,39 L30,-22 Z" fill="none" stroke="#D4924E" stroke-width="3.5" stroke-linejoin="round"/>
  <!-- handle -->
  <path d="M-13,-22 v-5 a13,13 0 0 1 26,0 v5" fill="none" stroke="#D4924E" stroke-width="3.5" stroke-linecap="round"/>
  <!-- bag crease -->
  <line x1="-24" y1="-12" x2="-28.5" y2="34" stroke="#D4924E" stroke-width="2.5" stroke-linecap="round" opacity="0.35"/>
  </g>

  <!-- border -->
  <rect width="1000" height="240" fill="none" stroke="#7A4A18" stroke-width="1" opacity="0.3"/>
</svg>
