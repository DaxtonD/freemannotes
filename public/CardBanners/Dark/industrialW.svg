  <!-- paper texture -->
  <rect width="1000" height="240" fill="#111618" filter="url(#tex)" opacity="0.06"/>

  <!-- icon -->
  <g transform="translate(880,120)">
  <!-- hex grid background pattern -->
  <g opacity="0.28" fill="none" stroke="#8AA0AA" stroke-width="1.5">
    <!-- row 1 hexes -->
    <polygon points="-42,-52 -28,-60 -14,-52 -14,-36 -28,-28 -42,-36"/>
    <polygon points="-14,-52 0,-60 14,-52 14,-36 0,-28 -14,-36"/>
    <polygon points="14,-52 28,-60 42,-52 42,-36 28,-28 14,-36"/>
    <!-- row 2 hexes (offset) -->
    <polygon points="-56,-28 -42,-36 -28,-28 -28,-12 -42,-4 -56,-12"/>
    <polygon points="-28,-28 -14,-36 0,-28 0,-12 -14,-4 -28,-12"/>
    <polygon points="0,-28 14,-36 28,-28 28,-12 14,-4 0,-12"/>
    <polygon points="28,-28 42,-36 56,-28 56,-12 42,-4 28,-12"/>
    <!-- row 3 hexes -->
    <polygon points="-42,-4 -28,-12 -14,-4 -14,12 -28,20 -42,12"/>
    <polygon points="-14,-4 0,-12 14,-4 14,12 0,20 -14,12"/>
    <polygon points="14,-4 28,-12 42,-4 42,12 28,20 14,12"/>
    <!-- row 4 hexes offset -->
    <polygon points="-28,20 -14,12 0,20 0,36 -14,44 -28,36"/>
    <polygon points="0,20 14,12 28,20 28,36 14,44 0,36"/>
  </g>
  <!-- large centered lambda -->
  <circle cx="0" cy="-6" r="46" fill="#8AA0AA" opacity="0.14"/>
  <circle cx="0" cy="-6" r="40" fill="none" stroke="#8AA0AA" stroke-width="3" opacity="0.5"/>
  <text x="-26" y="20" font-family="Georgia,Times New Roman,serif" font-size="78" fill="#8AA0AA" font-weight="bold" opacity="0.88">λ</text>
