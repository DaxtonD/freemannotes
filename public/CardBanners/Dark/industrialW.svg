<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="240" viewBox="0 0 1000 240">
  <defs>
    <filter id="tex_industrial_dark_w" x="0%" y="0%" width="100%" height="100%" color-interpolation-filters="linearRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.60" numOctaves="4" seed="12" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0" result="gn"/>
      <feBlend in="SourceGraphic" in2="gn" mode="overlay"/>
    </filter>
    <linearGradient id="hfade_industrial_dark_w" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"  stop-color="#111618" stop-opacity="0"/>
      <stop offset="50%" stop-color="#111618" stop-opacity="0"/>
      <stop offset="82%" stop-color="#111618" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#111618" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="vign_industrial_dark_w" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#8AA0AA" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#8AA0AA" stop-opacity="0.09"/>
    </linearGradient>
    <linearGradient id="diag_industrial_dark_w" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#202C30" stop-opacity="0"/>
      <stop offset="50%" stop-color="#202C30" stop-opacity="0"/>
      <stop offset="100%" stop-color="#202C30" stop-opacity="0.18"/>
    </linearGradient>
  </defs>

  <!-- base -->
  <rect width="1000" height="240" fill="#111618"/>
  <rect width="1000" height="240" fill="url(#vign_industrial_dark_w)"/>

  <!-- diagonal sheen -->
  <rect width="1000" height="240" fill="url(#diag_industrial_dark_w)"/>
  <rect width="1000" height="240" fill="url(#hfade_industrial_dark_w)"/>

  <!-- paper texture -->
  <rect width="1000" height="240" fill="#111618" filter="url(#tex_industrial_dark_w)" opacity="0.06"/>

  <!-- icon -->
  <g transform="translate(880,120) scale(0.6)">
  <!-- factory body (sawtooth roof) -->
  <path d="M-46,44 L-46,10 L-20,-10 L-20,10 L6,-10 L6,10 L32,-10 L32,10 L46,10 L46,44 Z" fill="#202C30" opacity="0.3"/>
  <path d="M-46,44 L-46,10 L-20,-10 L-20,10 L6,-10 L6,10 L32,-10 L32,10 L46,10 L46,44 Z" fill="none" stroke="#8AA0AA" stroke-width="3.5" stroke-linejoin="round"/>
  <!-- chimney seated on roofline + smoke -->
  <path d="M-42,-40 L-29,-40 L-29,-3 L-42,7 Z" fill="#8AA0AA" opacity="0.75"/>
  <circle cx="-32" cy="-45" r="3" fill="#8AA0AA" opacity="0.4"/>
  <circle cx="-23" cy="-42" r="4" fill="#8AA0AA" opacity="0.3"/>
  <!-- windows -->
  <rect x="-40" y="22" width="11" height="10" rx="2" fill="#8AA0AA" opacity="0.55"/>
  <rect x="-18" y="22" width="11" height="10" rx="2" fill="#8AA0AA" opacity="0.55"/>
  <rect x="4" y="22" width="11" height="10" rx="2" fill="#8AA0AA" opacity="0.55"/>
  <rect x="26" y="22" width="11" height="10" rx="2" fill="#8AA0AA" opacity="0.55"/>
  </g>

  <!-- border -->
  <rect width="1000" height="240" fill="none" stroke="#202C30" stroke-width="1" opacity="0.3"/>
</svg>
