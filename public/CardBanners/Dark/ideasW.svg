<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="240" viewBox="0 0 1000 240">
  <defs>
    <filter id="tex_ideas_dark_w" x="0%" y="0%" width="100%" height="100%" color-interpolation-filters="linearRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.60" numOctaves="4" seed="12" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0" result="gn"/>
      <feBlend in="SourceGraphic" in2="gn" mode="overlay"/>
    </filter>
    <linearGradient id="hfade_ideas_dark_w" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"  stop-color="#201A04" stop-opacity="0"/>
      <stop offset="50%" stop-color="#201A04" stop-opacity="0"/>
      <stop offset="82%" stop-color="#201A04" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#201A04" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="vign_ideas_dark_w" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#D4BE40" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#D4BE40" stop-opacity="0.09"/>
    </linearGradient>
    <linearGradient id="diag_ideas_dark_w" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#403208" stop-opacity="0"/>
      <stop offset="50%" stop-color="#403208" stop-opacity="0"/>
      <stop offset="100%" stop-color="#403208" stop-opacity="0.18"/>
    </linearGradient>
  </defs>

  <!-- base -->
  <rect width="1000" height="240" fill="#201A04"/>
  <rect width="1000" height="240" fill="url(#vign_ideas_dark_w)"/>

  <!-- diagonal sheen -->
  <rect width="1000" height="240" fill="url(#diag_ideas_dark_w)"/>
  <rect width="1000" height="240" fill="url(#hfade_ideas_dark_w)"/>

  <!-- paper texture -->
  <rect width="1000" height="240" fill="#201A04" filter="url(#tex_ideas_dark_w)" opacity="0.06"/>

  <!-- icon -->
  <g transform="translate(880,120) scale(0.6)">
  <!-- glow rays -->
  <line x1="0" y1="-36" x2="0" y2="-46" stroke="#D4BE40" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  <line x1="-18" y1="-37.5" x2="-24.4" y2="-45.2" stroke="#D4BE40" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  <line x1="18" y1="-37.5" x2="24.4" y2="-45.2" stroke="#D4BE40" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  <line x1="-27.6" y1="-12.8" x2="-37.4" y2="-14.5" stroke="#D4BE40" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  <line x1="27.6" y1="-12.8" x2="37.4" y2="-14.5" stroke="#D4BE40" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  <!-- bulb -->
  <circle cx="0" cy="-8" r="22" fill="#403208" opacity="0.3"/>
  <circle cx="0" cy="-8" r="22" fill="none" stroke="#D4BE40" stroke-width="3.5"/>
  <!-- filament -->
  <path d="M-6,8 v-7 a6,6 0 0 1 12,0 v7" fill="none" stroke="#D4BE40" stroke-width="2.5" stroke-linecap="round"/>
  <!-- base rings -->
  <rect x="-10" y="17" width="20" height="6" rx="3" fill="#D4BE40" opacity="0.85"/>
  <rect x="-8" y="26" width="16" height="6" rx="3" fill="#D4BE40" opacity="0.6"/>
  <rect x="-5" y="35" width="10" height="5" rx="2.5" fill="#D4BE40" opacity="0.45"/>
  </g>

  <!-- border -->
  <rect width="1000" height="240" fill="none" stroke="#403208" stroke-width="1" opacity="0.3"/>
</svg>
