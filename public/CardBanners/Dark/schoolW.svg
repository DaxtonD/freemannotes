<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="240" viewBox="0 0 1000 240">
  <defs>
    <filter id="tex_school_dark_w" x="0%" y="0%" width="100%" height="100%" color-interpolation-filters="linearRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.60" numOctaves="4" seed="12" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0" result="gn"/>
      <feBlend in="SourceGraphic" in2="gn" mode="overlay"/>
    </filter>
    <linearGradient id="hfade_school_dark_w" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"  stop-color="#0C1E12" stop-opacity="0"/>
      <stop offset="50%" stop-color="#0C1E12" stop-opacity="0"/>
      <stop offset="82%" stop-color="#0C1E12" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#0C1E12" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="vign_school_dark_w" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#5AAA72" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#5AAA72" stop-opacity="0.09"/>
    </linearGradient>
    <linearGradient id="diag_school_dark_w" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#143020" stop-opacity="0"/>
      <stop offset="50%" stop-color="#143020" stop-opacity="0"/>
      <stop offset="100%" stop-color="#143020" stop-opacity="0.18"/>
    </linearGradient>
  </defs>

  <!-- base -->
  <rect width="1000" height="240" fill="#0C1E12"/>
  <rect width="1000" height="240" fill="url(#vign_school_dark_w)"/>

  <!-- diagonal sheen -->
  <rect width="1000" height="240" fill="url(#diag_school_dark_w)"/>
  <rect width="1000" height="240" fill="url(#hfade_school_dark_w)"/>

  <!-- paper texture -->
  <rect width="1000" height="240" fill="#0C1E12" filter="url(#tex_school_dark_w)" opacity="0.06"/>

  <!-- icon -->
  <g transform="translate(880,120) scale(0.6)">
  <!-- cap base -->
  <path d="M-22,-8 L-22,10 C-22,17 -11,21 0,21 C11,21 22,17 22,10 L22,-8" fill="#143020" opacity="0.3"/>
  <path d="M-22,-8 L-22,10 C-22,17 -11,21 0,21 C11,21 22,17 22,10 L22,-8" fill="none" stroke="#5AAA72" stroke-width="3.5"/>
  <!-- mortarboard -->
  <path d="M0,-34 L46,-14 L0,6 L-46,-14 Z" fill="#143020" opacity="0.3"/>
  <path d="M0,-34 L46,-14 L0,6 L-46,-14 Z" fill="none" stroke="#5AAA72" stroke-width="3.5" stroke-linejoin="round"/>
  <circle cx="0" cy="-14" r="3" fill="#5AAA72"/>
  <!-- tassel -->
  <path d="M0,-14 L34,-6 L34,18" fill="none" stroke="#5AAA72" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="34" cy="23" r="4.5" fill="#5AAA72" opacity="0.9"/>
  <line x1="31" y1="28" x2="31" y2="33" stroke="#5AAA72" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <line x1="34" y1="29" x2="34" y2="34" stroke="#5AAA72" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <line x1="37" y1="28" x2="37" y2="33" stroke="#5AAA72" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  </g>

  <!-- border -->
  <rect width="1000" height="240" fill="none" stroke="#143020" stroke-width="1" opacity="0.3"/>
</svg>
