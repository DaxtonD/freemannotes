<svg xmlns="http://www.w3.org/2000/svg" width="520" height="240" viewBox="0 0 520 240">
  <defs>
    <filter id="tex_gaming_dark" x="0%" y="0%" width="100%" height="100%" color-interpolation-filters="linearRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.60" numOctaves="4" seed="12" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0" result="gn"/>
      <feBlend in="SourceGraphic" in2="gn" mode="overlay"/>
    </filter>
    <linearGradient id="hfade_gaming_dark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"  stop-color="#16101E" stop-opacity="0"/>
      <stop offset="50%" stop-color="#16101E" stop-opacity="0"/>
      <stop offset="82%" stop-color="#16101E" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#16101E" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="vign_gaming_dark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#A870D8" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#A870D8" stop-opacity="0.09"/>
    </linearGradient>
    <linearGradient id="diag_gaming_dark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2C1A3C" stop-opacity="0"/>
      <stop offset="50%" stop-color="#2C1A3C" stop-opacity="0"/>
      <stop offset="100%" stop-color="#2C1A3C" stop-opacity="0.18"/>
    </linearGradient>
  </defs>

  <!-- base -->
  <rect width="520" height="240" fill="#16101E"/>
  <rect width="520" height="240" fill="url(#vign_gaming_dark)"/>

  <!-- diagonal sheen -->
  <rect width="520" height="240" fill="url(#diag_gaming_dark)"/>
  <rect width="520" height="240" fill="url(#hfade_gaming_dark)"/>

  <!-- paper texture -->
  <rect width="520" height="240" fill="#16101E" filter="url(#tex_gaming_dark)" opacity="0.06"/>

  <!-- icon -->
  <g transform="translate(420,120)">
  <!-- controller body -->
  <rect x="-46" y="-25" width="92" height="52" rx="26" fill="#2C1A3C" opacity="0.3"/>
  <rect x="-46" y="-25" width="92" height="52" rx="26" fill="none" stroke="#A870D8" stroke-width="3.5"/>
  <!-- d-pad -->
  <rect x="-35" y="-4" width="24" height="9" rx="3" fill="#A870D8" opacity="0.85"/>
  <rect x="-27.5" y="-11.5" width="9" height="24" rx="3" fill="#A870D8" opacity="0.85"/>
  <!-- face buttons -->
  <circle cx="24" cy="-8" r="4.5" fill="#A870D8" opacity="0.55"/>
  <circle cx="33" cy="1" r="4.5" fill="#A870D8" opacity="0.55"/>
  <circle cx="15" cy="1" r="4.5" fill="#A870D8" opacity="0.55"/>
  <circle cx="24" cy="10" r="4.5" fill="#A870D8" opacity="0.9"/>
  </g>

  <!-- border -->
  <rect width="520" height="240" fill="none" stroke="#2C1A3C" stroke-width="1" opacity="0.3"/>
</svg>
