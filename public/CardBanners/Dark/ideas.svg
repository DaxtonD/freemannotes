  <rect x="-10" y="17" width="20" height="6" rx="3" fill="#D4BE40" opacity="0.85"/>
  <rect x="-8" y="26" width="16" height="6" rx="3" fill="#D4BE40" opacity="0.6"/>
  <rect x="-5" y="35" width="10" height="5" rx="2.5" fill="#D4BE40" opacity="0.45"/>
