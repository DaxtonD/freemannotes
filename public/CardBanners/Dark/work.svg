<svg xmlns="http://www.w3.org/2000/svg" width="520" height="240" viewBox="0 0 520 240">
  <defs>
    <filter id="tex_work_dark" x="0%" y="0%" width="100%" height="100%" color-interpolation-filters="linearRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.60" numOctaves="4" seed="12" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0" result="gn"/>
      <feBlend in="SourceGraphic" in2="gn" mode="overlay"/>
    </filter>
    <linearGradient id="hfade_work_dark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"  stop-color="#0C1E24" stop-opacity="0"/>
      <stop offset="50%" stop-color="#0C1E24" stop-opacity="0"/>
      <stop offset="82%" stop-color="#0C1E24" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#0C1E24" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="vign_work_dark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#5AAAC0" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#5AAAC0" stop-opacity="0.09"/>
    </linearGradient>
    <linearGradient id="diag_work_dark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1A4455" stop-opacity="0"/>
      <stop offset="50%" stop-color="#1A4455" stop-opacity="0"/>
      <stop offset="100%" stop-color="#1A4455" stop-opacity="0.18"/>
    </linearGradient>
  </defs>

  <!-- base -->
  <rect width="520" height="240" fill="#0C1E24"/>
  <rect width="520" height="240" fill="url(#vign_work_dark)"/>

  <!-- diagonal sheen -->
  <rect width="520" height="240" fill="url(#diag_work_dark)"/>
  <rect width="520" height="240" fill="url(#hfade_work_dark)"/>

  <!-- paper texture -->
  <rect width="520" height="240" fill="#0C1E24" filter="url(#tex_work_dark)" opacity="0.06"/>

  <!-- icon -->
  <g transform="translate(420,120)">
  <!-- handle -->
  <path d="M-13,-18 v-5 a7,7 0 0 1 7,-7 h12 a7,7 0 0 1 7,7 v5" fill="none" stroke="#5AAAC0" stroke-width="3.5"/>
  <!-- briefcase body -->
  <rect x="-44" y="-18" width="88" height="60" rx="9" fill="#1A4455" opacity="0.3"/>
  <rect x="-44" y="-18" width="88" height="60" rx="9" fill="none" stroke="#5AAAC0" stroke-width="3.5"/>
  <!-- lid seam -->
  <line x1="-44" y1="3" x2="-8" y2="3" stroke="#5AAAC0" stroke-width="2.5" opacity="0.6"/>
  <line x1="8" y1="3" x2="44" y2="3" stroke="#5AAAC0" stroke-width="2.5" opacity="0.6"/>
  <!-- clasp -->
  <rect x="-8" y="-3" width="16" height="13" rx="3" fill="#5AAAC0" opacity="0.9"/>
  </g>

  <!-- border -->
  <rect width="520" height="240" fill="none" stroke="#1A4455" stroke-width="1" opacity="0.3"/>
</svg>
