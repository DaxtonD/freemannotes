      <line x1="180" y1="0" x2="420" y2="240" stroke="#1A4455" stroke-width="2.2" opacity="0.4"/>
      <line x1="198" y1="0" x2="438" y2="240" stroke="#1A4455" stroke-width="2.2" opacity="0.4"/>
      <line x1="216" y1="0" x2="456" y2="240" stroke="#1A4455" stroke-width="2.2" opacity="0.4"/>
      <line x1="234" y1="0" x2="474" y2="240" stroke="#1A4455" stroke-width="2.2" opacity="0.4"/>
      <line x1="252" y1="0" x2="492" y2="240" stroke="#1A4455" stroke-width="2.2" opacity="0.4"/>
      <line x1="270" y1="0" x2="510" y2="240" stroke="#1A4455" stroke-width="2.2" opacity="0.4"/>
      <line x1="288" y1="0" x2="528" y2="240" stroke="#1A4455" stroke-width="2.2" opacity="0.4"/>
