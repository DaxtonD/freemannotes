  </g>

  <!-- paper texture -->
  <rect width="520" height="240" fill="#0C1E24" filter="url(#tex)" opacity="0.06"/>

  <!-- icon -->
  <g transform="translate(420,120)">
  <!-- briefcase body -->
  <rect x="-38" y="-20" width="76" height="52" rx="5" fill="#1A4455" opacity="0.25"/>
  <rect x="-38" y="-20" width="76" height="52" rx="5" fill="none" stroke="#5AAAC0" stroke-width="3.5"/>
  <!-- handle -->
  <path d="M-16,-20 L-16,-32 Q-16,-40 0,-40 Q16,-40 16,-32 L16,-20" fill="none" stroke="#5AAAC0" stroke-width="3.5" stroke-linecap="round"/>
  <!-- center clasp bar -->
  <line x1="-38" y1="2" x2="38" y2="2" stroke="#5AAAC0" stroke-width="2.8"/>
  <rect x="-8" y="-4" width="16" height="12" rx="3" fill="none" stroke="#5AAAC0" stroke-width="2.5"/>
  <!-- document lines inside -->
  <line x1="-28" y1="12" x2="-4" y2="12" stroke="#5AAAC0" stroke-width="2" opacity="0.55"/>
  <line x1="-28" y1="22" x2="-4" y2="22" stroke="#5AAAC0" stroke-width="2" opacity="0.55"/>
  <!-- pen -->
  <line x1="8" y1="8" x2="28" y2="28" stroke="#5AAAC0" stroke-width="3" stroke-linecap="round"/>
  <path d="M8,8 L4,4 L10,-2 L14,2 Z" fill="#5AAAC0" opacity="0.75"/>
  <path d="M28,28 L24,32 L30,30 Z" fill="#5AAAC0" opacity="0.75"/>
</g>

  <!-- border -->
  <rect width="520" height="240" fill="none" stroke="#1A4455" stroke-width="1" opacity="0.3"/>
</svg>