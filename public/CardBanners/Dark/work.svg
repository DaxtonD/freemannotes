      <line x1="522" y1="0" x2="762" y2="240" stroke="#1A4455" stroke-width="2.2" opacity="0.4"/>
      <line x1="540" y1="0" x2="780" y2="240" stroke="#1A4455" stroke-width="2.2" opacity="0.4"/>
