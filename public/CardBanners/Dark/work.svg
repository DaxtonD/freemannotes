      <line x1="360" y1="0" x2="600" y2="240" stroke="#1A4455" stroke-width="2.2" opacity="0.4"/>
      <line x1="378" y1="0" x2="618" y2="240" stroke="#1A4455" stroke-width="2.2" opacity="0.4"/>
      <line x1="396" y1="0" x2="636" y2="240" stroke="#1A4455" stroke-width="2.2" opacity="0.4"/>
      <line x1="414" y1="0" x2="654" y2="240" stroke="#1A4455" stroke-width="2.2" opacity="0.4"/>
      <line x1="432" y1="0" x2="672" y2="240" stroke="#1A4455" stroke-width="2.2" opacity="0.4"/>
      <line x1="450" y1="0" x2="690" y2="240" stroke="#1A4455" stroke-width="2.2" opacity="0.4"/>
