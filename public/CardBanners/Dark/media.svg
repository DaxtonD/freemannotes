  <rect x="-42" y="-14" width="84" height="50" rx="5" fill="none" stroke="#8878C8" stroke-width="3.5"/>
  <!-- hinge -->
  <circle cx="-36" cy="-8" r="3" fill="#8878C8" opacity="0.8"/>
  <!-- play button -->
  <path d="M-7,1 L15,11 L-7,21 Z" fill="#8878C8" opacity="0.9"/>
  </g>

  <!-- border -->
  <rect width="520" height="240" fill="none" stroke="#1C1840" stroke-width="1" opacity="0.3"/>
