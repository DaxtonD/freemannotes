<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="240" viewBox="0 0 1000 240">
  <defs>
    <filter id="tex_important_dark_w" x="0%" y="0%" width="100%" height="100%" color-interpolation-filters="linearRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.60" numOctaves="4" seed="12" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0" result="gn"/>
      <feBlend in="SourceGraphic" in2="gn" mode="overlay"/>
    </filter>
    <linearGradient id="hfade_important_dark_w" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"  stop-color="#220A08" stop-opacity="0"/>
      <stop offset="50%" stop-color="#220A08" stop-opacity="0"/>
      <stop offset="82%" stop-color="#220A08" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#220A08" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="vign_important_dark_w" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#D85050" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#D85050" stop-opacity="0.09"/>
    </linearGradient>
    <linearGradient id="diag_important_dark_w" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3C0E0C" stop-opacity="0"/>
      <stop offset="50%" stop-color="#3C0E0C" stop-opacity="0"/>
      <stop offset="100%" stop-color="#3C0E0C" stop-opacity="0.18"/>
    </linearGradient>
  </defs>

  <!-- base -->
  <rect width="1000" height="240" fill="#220A08"/>
  <rect width="1000" height="240" fill="url(#vign_important_dark_w)"/>

  <!-- diagonal sheen -->
  <rect width="1000" height="240" fill="url(#diag_important_dark_w)"/>
  <rect width="1000" height="240" fill="url(#hfade_important_dark_w)"/>

  <!-- paper texture -->
  <rect width="1000" height="240" fill="#220A08" filter="url(#tex_important_dark_w)" opacity="0.06"/>

  <!-- icon -->
  <g transform="translate(880,120) scale(0.6)">
  <!-- warning triangle -->
  <path d="M0,-38 L42,34 L-42,34 Z" fill="#3C0E0C" opacity="0.3"/>
  <path d="M0,-38 L42,34 L-42,34 Z" fill="none" stroke="#D85050" stroke-width="7" stroke-linejoin="round"/>
  <!-- exclamation mark -->
  <line x1="0" y1="-12" x2="0" y2="10" stroke="#D85050" stroke-width="7" stroke-linecap="round"/>
  <circle cx="0" cy="22" r="4.5" fill="#D85050"/>
  </g>

  <!-- border -->
  <rect width="1000" height="240" fill="none" stroke="#3C0E0C" stroke-width="1" opacity="0.3"/>
</svg>
