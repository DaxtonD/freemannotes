  <!-- outer ring/seal -->
  <circle cx="0" cy="0" r="52" fill="none" stroke="#D85050" stroke-width="3" opacity="0.3" stroke-dasharray="8,5"/>
  <circle cx="0" cy="0" r="44" fill="#D85050" opacity="0.15"/>
  <circle cx="0" cy="0" r="44" fill="none" stroke="#D85050" stroke-width="3.5"/>
  <!-- warning triangle inside -->
