<svg xmlns="http://www.w3.org/2000/svg" width="520" height="240" viewBox="0 0 520 240">
  <defs>
    <filter id="tex_maintenance_dark" x="0%" y="0%" width="100%" height="100%" color-interpolation-filters="linearRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.60" numOctaves="4" seed="12" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0" result="gn"/>
      <feBlend in="SourceGraphic" in2="gn" mode="overlay"/>
    </filter>
    <linearGradient id="hfade_maintenance_dark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"  stop-color="#0E1610" stop-opacity="0"/>
      <stop offset="50%" stop-color="#0E1610" stop-opacity="0"/>
      <stop offset="82%" stop-color="#0E1610" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#0E1610" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="vign_maintenance_dark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#70B070" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#70B070" stop-opacity="0.09"/>
    </linearGradient>
    <linearGradient id="diag_maintenance_dark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1A3018" stop-opacity="0"/>
      <stop offset="50%" stop-color="#1A3018" stop-opacity="0"/>
      <stop offset="100%" stop-color="#1A3018" stop-opacity="0.18"/>
    </linearGradient>
  </defs>

  <!-- base -->
  <rect width="520" height="240" fill="#0E1610"/>
  <rect width="520" height="240" fill="url(#vign_maintenance_dark)"/>

  <!-- diagonal sheen -->
  <rect width="520" height="240" fill="url(#diag_maintenance_dark)"/>
  <rect width="520" height="240" fill="url(#hfade_maintenance_dark)"/>

  <!-- paper texture -->
  <rect width="520" height="240" fill="#0E1610" filter="url(#tex_maintenance_dark)" opacity="0.06"/>

  <!-- icon -->
  <g transform="translate(420,120)">
  <!-- hex nut -->
  <g transform="translate(30,-30)">
    <path d="M0,-12 L10.4,-6 L10.4,6 L0,12 L-10.4,6 L-10.4,-6 Z" fill="none" stroke="#70B070" stroke-width="3" stroke-linejoin="round" opacity="0.6"/>
    <circle cx="0" cy="0" r="4.5" fill="none" stroke="#70B070" stroke-width="2.5" opacity="0.6"/>
  </g>
  <!-- wrench: open jaw top-left, handle to bottom-right -->
  <g transform="scale(3.6) translate(-12,-11.8)">
    <path d="M22.7,19l-9.1-9.1c0.9-2.3,0.4-5-1.5-6.9c-2-2-5-2.4-7.4-1.3L9,6L6,9L1.6,4.7C0.4,7.1,0.9,10.1,2.9,12.1c1.9,1.9,4.6,2.4,6.9,1.5l9.1,9.1c0.4,0.4,1,0.4,1.4,0l2.3-2.3C23.1,20,23.1,19.4,22.7,19z" fill="#70B070" opacity="0.9"/>
  </g>
  </g>

  <!-- border -->
  <rect width="520" height="240" fill="none" stroke="#1A3018" stroke-width="1" opacity="0.3"/>
</svg>
