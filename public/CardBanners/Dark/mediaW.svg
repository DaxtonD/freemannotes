<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="240" viewBox="0 0 1000 240">
  <defs>
    <filter id="tex_media_dark_w" x="0%" y="0%" width="100%" height="100%" color-interpolation-filters="linearRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.60" numOctaves="4" seed="12" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0" result="gn"/>
      <feBlend in="SourceGraphic" in2="gn" mode="overlay"/>
    </filter>
    <linearGradient id="hfade_media_dark_w" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"  stop-color="#101028" stop-opacity="0"/>
      <stop offset="50%" stop-color="#101028" stop-opacity="0"/>
      <stop offset="82%" stop-color="#101028" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#101028" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="vign_media_dark_w" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#8878C8" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#8878C8" stop-opacity="0.09"/>
    </linearGradient>
    <linearGradient id="diag_media_dark_w" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1C1840" stop-opacity="0"/>
      <stop offset="50%" stop-color="#1C1840" stop-opacity="0"/>
      <stop offset="100%" stop-color="#1C1840" stop-opacity="0.18"/>
    </linearGradient>
  </defs>

  <!-- base -->
  <rect width="1000" height="240" fill="#101028"/>
  <rect width="1000" height="240" fill="url(#vign_media_dark_w)"/>

  <!-- diagonal sheen -->
  <rect width="1000" height="240" fill="url(#diag_media_dark_w)"/>
  <rect width="1000" height="240" fill="url(#hfade_media_dark_w)"/>

  <!-- paper texture -->
  <rect width="1000" height="240" fill="#101028" filter="url(#tex_media_dark_w)" opacity="0.06"/>

  <!-- icon -->
  <g transform="translate(880,120) scale(0.6)">
  <!-- clapper top (angled) -->
  <g transform="rotate(-10,-42,-14)">
    <rect x="-42" y="-32" width="84" height="18" rx="4" fill="#1C1840" opacity="0.3"/>
    <rect x="-42" y="-32" width="84" height="18" rx="4" fill="none" stroke="#8878C8" stroke-width="3.5"/>
    <path d="M-34,-32 l11,0 l-7,18 l-11,0 Z" fill="#8878C8" opacity="0.7"/>
    <path d="M-12,-32 l11,0 l-7,18 l-11,0 Z" fill="#8878C8" opacity="0.7"/>
    <path d="M10,-32 l11,0 l-7,18 l-11,0 Z" fill="#8878C8" opacity="0.7"/>
    <path d="M32,-32 l10,0 l-7,18 l-10,0 Z" fill="#8878C8" opacity="0.7"/>
  </g>
  <!-- board body -->
  <rect x="-42" y="-14" width="84" height="50" rx="5" fill="#1C1840" opacity="0.3"/>
  <rect x="-42" y="-14" width="84" height="50" rx="5" fill="none" stroke="#8878C8" stroke-width="3.5"/>
  <!-- hinge -->
  <circle cx="-36" cy="-8" r="3" fill="#8878C8" opacity="0.8"/>
  <!-- play button -->
  <path d="M-7,1 L15,11 L-7,21 Z" fill="#8878C8" opacity="0.9"/>
  </g>

  <!-- border -->
  <rect width="1000" height="240" fill="none" stroke="#1C1840" stroke-width="1" opacity="0.3"/>
</svg>
