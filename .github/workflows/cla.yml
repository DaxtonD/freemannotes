name: CLA Assistant

# Asks first-time contributors to sign CLA.md, and records the signature so they're never asked
# again. The signature file lives on its own `cla-signatures` branch so it never clutters main.
#
# One-time setup before this does anything: create a classic Personal Access Token with `repo`
# scope and save it as the repository secret CLA_SIGNATURES_TOKEN. The built-in GITHUB_TOKEN
# cannot write to another branch from a pull_request_target run, which is why a PAT is needed —
# if the job fails with a permissions error, that secret is missing or expired.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  actions: write
  contents: read
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: Check or record CLA signature
        # Runs on every PR, and on the one comment that counts as a signature. Anything else a
        # person types in the thread is ignored.
        if: >
          github.event_name == 'pull_request_target' ||
          github.event.comment.body == 'recheck' ||
          github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PERSONAL_ACCESS_TOKEN: ${{ secrets.CLA_SIGNATURES_TOKEN }}
        with:
          path-to-document: 'https://github.com/DaxtonD/freemannotes/blob/main/CLA.md'
          path-to-signatures: 'signatures/version1/cla.json'
          branch: 'cla-signatures'
          # The project owner doesn't sign an agreement with himself, and bots can't agree to one.
          allowlist: DaxtonD,bot*,dependabot[bot]
          custom-notsigned-prcomment: >
            Thanks for this! Before it can be merged, please read
            [CLA.md](https://github.com/DaxtonD/freemannotes/blob/main/CLA.md) and post a comment
            below with exactly this line to sign it. You keep the copyright in your work — it's a
            licence grant, not an assignment, and you only ever do this once.
          custom-allsigned-prcomment: >
            CLA signed — thank you. On to the actual review.
