# Freeman Notes — run the app container locally against an EXTERNAL Postgres + Redis
# (e.g. your Unraid database/cache containers).
#
# Unlike docker-compose.yml (the full self-contained stack), this file does NOT
# start its own Postgres/Redis. It only builds and runs the app from your current
# working tree and reads every connection setting from .env.docker — so you point
# DATABASE_URL / REDIS_URL at your existing containers by IP.
#
#   cp .env.docker.example .env.docker      # then edit DATABASE_URL + REDIS_URL
#   docker compose -f docker-compose.local.yml --env-file .env.docker up -d --build
#
# Easier: use the wrapper scripts, which do the copy-on-first-run for you:
#   Windows:      .\scripts\run-docker.ps1
#   Linux/macOS:  ./scripts/run-docker.sh
services:
  freemannotes:
    build:
      context: .
      dockerfile: Dockerfile
    image: freemannotes:local
    container_name: freemannotes
    init: true
    restart: unless-stopped
    # Passes every key in .env.docker into the container (DATABASE_URL, REDIS_URL,
    # AUTH_JWT_SECRET, etc.). The --env-file flag on the command line additionally
    # feeds ${APP_PORT}/${PORT} substitution below.
    env_file:
      - .env.docker
    ports:
      - "${APP_PORT:-27015}:${PORT:-27015}"
    volumes:
      - freemannotes-uploads:/app/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:' + (process.env.PORT || '27015') + '/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  freemannotes-uploads:
